# =============================================================================
# Composição das ZONAS — CityLens · Radiografia Urbana de Sorocaba
# =============================================================================
# Unidade de análise = as 6 ZONAS OFICIAIS do zoneamento da Prefeitura/Urbes
# (Centro, Norte, Oeste, Sul, Leste, Industrial). Esta config é a fonte única
# da composição — o site (mockups/) e o pipeline leem a mesma divisão.
#
# Cada zona lista os BAIRROS transcritos do mapa oficial. O passo 2 do pipeline
# (step02_zonas.py) geocodifica esses nomes e atribui cada SETOR CENSITÁRIO do
# IBGE à zona do bairro mais próximo (método "nearest_bairro"), gravando o
# resultado em data/processed/setores_por_zona.csv. Você NÃO digita setor a setor.
#
# Regra do projeto — NÃO INVENTAR DADO: bairro que não geocodificar é reportado
# e ignorado (nunca chutado); zona sem nenhum bairro geocodificado interrompe o
# passo com aviso.
# =============================================================================

meta:
  municipio: "Sorocaba"
  uf: "SP"
  codigo_ibge: "3552205"
  censo: 2022
  fonte_zonas: >
    Mapa oficial de zoneamento da Prefeitura de Sorocaba / Urbes (PDFs em
    mapa-01-macrozoneamento.pdf, mapa-02-zoneamento.pdf, mapa_zoneamento.pdf).
    Bairros transcritos região por região; a lista cobre a maioria, mas nem
    todos os rótulos do PDF são legíveis.
  metodo_recorte: "nearest_bairro"   # setor -> zona do bairro geocodificado mais próximo
  observacao: >
    As zonas são as oficiais; a atribuição de cada setor à sua zona é uma
    aproximação por proximidade (recorte analítico documentado), até existir a
    geometria oficial das zonas em formato vetorial.

# Eixos esperados do índice (selo de confiabilidade = calculados / esperados).
# PCD (acessibilidade) fica FORA do cálculo no MVP (sempre "dados insuficientes").
eixos_esperados:
  - servicos_essenciais
  - mobilidade
  - acesso_urbano
  - meio_ambiente

regions:

  centro:
    nome: "Centro"
    # Bairros do mapa oficial (geocodificados p/ o recorte por proximidade):
    bairros:
      - "Centro"
    # Pontos de referência do mapa (só documentam a zona; fora do recorte):
    referencias:
      - "Catedral Metropolitana"
      - "Mercado Municipal"
      - "Museu Ferroviário"
      - "Rodoviária"
      - "Estação Ferroviária"
      - "PUC"

<title>CityLens Sorocaba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#F3F6F5;
    --surface:#FFFFFF;
    --surface-2:#F7FAF9;
    --ink:#132320;
    --ink-soft:#4C605B;
    --ink-faint:#7C8E89;
    --line:#DCE5E2;
    --line-strong:#C4D2CE;
    --accent:#0C6E6C;
    --accent-soft:#0C6E6C1a;
    --warn:#B26A00;
    --warn-soft:#B26A0016;
    --shadow:0 1px 2px rgba(19,35,32,.05),0 8px 24px rgba(19,35,32,.06);
    --ramp-lo:234,244,242;
    --ramp-mid:95,176,172;
    --ramp-hi:10,79,82;
    --map-void:#E7EEEC;
    --map-stroke:#FFFFFF;
    --map-land:#E6EDEA;
    --map-neighbor:#D6E0DC;
    --map-stroke2:#BFCDC8;
    --map-neighlbl:#889892;
    --map-soro-fill:#D8EAE6;
    --map-veil:rgba(0,0,0,0);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#0A1211;
      --surface:#111C1A;
      --surface-2:#0E1817;
      --ink:#EAF3F0;
      --ink-soft:#9FB4AF;
      --ink-faint:#6E8480;
      --line:#22322E;
      --line-strong:#2C403B;
      --accent:#35B7B0;
      --accent-soft:#35B7B01f;
      --warn:#E39B3C;
      --warn-soft:#E39B3C1c;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
      --ramp-lo:18,46,43;
      --ramp-mid:46,143,134;
      --ramp-hi:88,224,214;
      --map-void:#16211F;
      --map-stroke:#0A1211;
      --map-land:#0E1917;
      --map-neighbor:#152220;
      --map-stroke2:#26332F;
      --map-neighlbl:#5E726D;
      --map-soro-fill:#123230;
      --map-veil:rgba(8,15,14,0.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1211;
    --surface:#111C1A;
    --surface-2:#0E1817;
    --ink:#EAF3F0;
    --ink-soft:#9FB4AF;
    --ink-faint:#6E8480;
    --line:#22322E;
    --line-strong:#2C403B;
    --accent:#35B7B0;
    --accent-soft:#35B7B01f;
    --warn:#E39B3C;
    --warn-soft:#E39B3C1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --ramp-lo:18,46,43;
    --ramp-mid:46,143,134;
    --ramp-hi:88,224,214;
    --map-void:#16211F;
    --map-stroke:#0A1211;
    --map-land:#0E1917;
    --map-neighbor:#152220;
    --map-stroke2:#26332F;
    --map-neighlbl:#5E726D;
    --map-soro-fill:#123230;
    --map-veil:rgba(8,15,14,0.45);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
  h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
  h1,h2,.cov-title,.map-head h2,.pt-name,.cmp-sum .cs-n{font-family:'Archivo','IBM Plex Sans',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-family:'Archivo','IBM Plex Sans',system-ui,sans-serif}
  a{color:var(--accent)}
  button{font-family:inherit}
  ::selection{background:var(--accent);color:#fff}

  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}

  /* ============ TOP BAR ============ */
  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-inner{display:flex;align-items:center;gap:16px;height:62px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .glyph{width:34px;height:34px;flex:none;border-radius:9px;background:#111d1b;display:grid;place-items:center;box-shadow:var(--shadow)}
  .glyph-img{width:25px;height:25px;display:block;object-fit:contain}
  .brand-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
  .brand-txt .b1{font-family:'Archivo','IBM Plex Sans',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
  .brand-txt .b2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
  .spacer{flex:1}
  .mock-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:5px 10px;border-radius:999px}
  .mock-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .theme-btn{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}

  /* ============ TABS ============ */
  .tabs{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:62px;z-index:30}
  .tabs-inner{display:flex;gap:8px;max-width:1180px;margin:0 auto;padding:11px 22px;width:100%;overflow-x:auto}
  .tab{appearance:none;border:1px solid var(--line);cursor:pointer;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--surface);border-radius:999px;white-space:nowrap;transition:transform .14s ease,background .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease}
  .tab:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}
  .tab[aria-selected="true"]{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
  .tabs-inner::-webkit-scrollbar{height:0}

  /* ============ NOTICE ============ */
  .notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);border-radius:12px;padding:11px 14px;margin:20px 0 4px;font-size:13px;color:var(--ink)}
  .notice svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--warn)}
  .notice b{color:var(--warn)}

  main{padding-bottom:70px}
  .screen{padding-top:22px;animation:fade .4s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}*{scroll-behavior:auto!important}}

  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;font-family:'IBM Plex Mono',monospace}
  .lead{color:var(--ink-soft);font-size:14.5px;max-width:64ch}

  /* ============ CARDS ============ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* ============ MAPA ============ */
  .map-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
  .map-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .map-head h2{font-size:22px;letter-spacing:-.02em}
  .seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px}
  .seg button{appearance:none;border:0;background:none;cursor:pointer;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

  .map-card{padding:14px 14px 30px;position:relative}
  .map-stage{position:relative}
  .mapsvg{width:100%;height:auto;display:block;touch-action:manipulation;overflow:hidden;border-radius:10px;background:var(--map-land)}
  .map-bg{fill:var(--map-land)}
  .neigh{fill:var(--map-neighbor);stroke:var(--map-stroke2);stroke-width:1;stroke-linejoin:round}
  .neigh-lbl{fill:var(--map-neighlbl);font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--map-land);stroke-width:3px;stroke-linejoin:round}
  .soro-shape{fill:var(--map-soro-fill);stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
  .soro-cap{position:absolute;right:22px;bottom:22px;font-size:10.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;max-width:70%;line-height:1.4;pointer-events:none;background:color-mix(in srgb,var(--surface) 86%,transparent);padding:5px 9px;border-radius:8px;text-align:right;backdrop-filter:blur(3px)}
  .compass{fill:var(--ink-faint)}
  .pin{cursor:pointer}
  .pin:focus{outline:none}
  .pin-halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;transition:opacity .15s}
  .pin:hover .pin-halo{opacity:.4}
  .pin.sel .pin-halo{opacity:.7;stroke:var(--ink);stroke-width:3.5}
  .pin:focus-visible .pin-halo{opacity:.7;stroke:var(--accent)}
  .pin-dot{stroke:var(--surface);stroke-width:3;transition:transform .12s;transform-box:fill-box;transform-origin:center}
  .pin:hover .pin-dot{stroke-width:3.5}
  .pin-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;pointer-events:none;dominant-baseline:central}
  .pin-name{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}

  /* popup da região sobre o mapa */
  .mpop{position:absolute;z-index:20;width:250px;max-width:82%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);transform:translate(-50%,calc(-100% - 20px));animation:pop .18s ease both}
  @keyframes pop{from{opacity:0;transform:translate(-50%,calc(-100% - 12px))}to{opacity:1;transform:translate(-50%,calc(-100% - 20px))}}
  .mpop::after{content:"";position:absolute;left:50%;bottom:-8px;width:15px;height:15px;background:var(--surface);border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
  .mpop-h{display:flex;align-items:center;gap:10px;padding:13px 14px 10px}
  .mpop-h .mp-sw{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px}
  .mpop-h .mp-t{flex:1;min-width:0}
  .mpop-h .mp-t .n{display:block;font-weight:600;font-size:15px;line-height:1.15}
  .mpop-h .mp-t .s{display:block;font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
  .mpop-close{appearance:none;border:0;background:none;cursor:pointer;color:var(--ink-faint);padding:4px;border-radius:6px;line-height:0}
  .mpop-close:hover{color:var(--ink);background:var(--surface-2)}
  .mpop-axes{padding:2px 14px 8px;display:flex;flex-direction:column;gap:7px}
  .mpax{display:grid;grid-template-columns:74px 1fr 26px;gap:8px;align-items:center;font-size:11px}
  .mpax .k{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mpax .bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .mpax .bar i{display:block;height:100%;border-radius:3px}
  .mpax .vv{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;color:var(--ink)}
  .mpax .vv.na{color:var(--ink-faint);font-weight:400}
  .mpax.on{background:var(--accent-soft);border-radius:6px;margin:0 -6px;padding:3px 6px}
  .mpax.on .k{color:var(--accent);font-weight:600}
  .mpop-comp{padding:2px 14px 10px;font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
  .mpop-comp b{color:var(--ink-soft)}
  .mpop-cta{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;padding:11px;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent);border-radius:0 0 13px 13px}
  .mpop-cta:hover{background:var(--accent-soft)}
  .map-hint{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:2px}

  .legend{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .legend .bar{height:10px;flex:1;min-width:160px;border-radius:5px;border:1px solid var(--line)}
  .legend .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;width:100%;margin-top:-4px}
  .legend .cap{font-size:12px;color:var(--ink-soft)}
  .hatch-key{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .hatch-swatch{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background-image:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 5px)}

  /* ranked list */
  .ranklist{padding:8px}
  .ranklist h3{font-size:13px;padding:8px 10px 4px;color:var(--ink-soft);font-weight:600}
  .rank{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:9px 10px;border-radius:10px}
  .rank:hover{background:var(--surface-2)}
  .rank.sel{background:var(--accent-soft)}
  .rank .swatch{width:12px;height:34px;border-radius:4px;flex:none}
  .rank .rk-name{flex:1;min-width:0}
  .rank .rk-name .n{display:block;font-weight:600;font-size:14px}
  .rank .rk-name .s{display:block;font-size:11.5px;color:var(--ink-faint)}
  .rank .rk-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;letter-spacing:-.02em}
  .rank .rk-val small{font-size:11px;color:var(--ink-faint);font-weight:400}
  .rank .chev{color:var(--ink-faint);flex:none}
  .rank.na .rk-val{color:var(--ink-faint);font-size:13px}

  /* tooltip */
  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 11px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity .12s;max-width:230px}
  .tip.on{opacity:1;transform:none}
  .tip .t-n{font-weight:600;margin-bottom:2px}
  .tip .t-v{font-family:'IBM Plex Mono',monospace}
  .tip .t-s{color:color-mix(in srgb,var(--paper) 70%,var(--ink));font-size:11px;margin-top:3px}

  /* ============ REGIÃO ============ */
  .sel-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
  .picker{position:relative}
  .picker select{appearance:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:10px 40px 10px 14px;cursor:pointer;box-shadow:var(--shadow)}
  .picker select:hover{border-color:var(--accent)}
  .picker .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-faint)}
  .picker .pl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:5px;font-family:'IBM Plex Mono',monospace}

  .region-top{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:stretch;margin-bottom:22px}
  .index-card{padding:22px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
  .index-card .ic-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;font-family:'IBM Plex Mono',monospace}
  .gauge{display:flex;align-items:baseline;gap:8px;margin:2px 0}
  .gauge .num{font-family:'IBM Plex Mono',monospace;font-size:62px;font-weight:600;letter-spacing:-.04em;line-height:1}
  .gauge .den{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--ink-faint)}
  .gauge-track{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
  .gauge-fill{height:100%;border-radius:5px}
  .seal{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .seal .ring{--p:100;width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
  .seal .ring i{width:30px;height:30px;background:var(--surface);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;font-style:normal;color:var(--ink)}
  .seal .st{font-size:12.5px;line-height:1.35}
  .seal .st b{display:block;font-size:13px}
  .seal .st span{color:var(--ink-faint)}

  .setores-card{padding:20px}
  .setores-card h3{font-size:13px;color:var(--ink-soft);margin-bottom:4px}
  .setores-card p{font-size:12.5px;color:var(--ink-faint);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--ink-soft)}
  .setores-card .note{margin-top:14px;font-size:12px;color:var(--ink-faint);display:flex;gap:8px;align-items:flex-start}
  .setores-card .note svg{flex:none;width:14px;height:14px;margin-top:2px;color:var(--accent)}

  .axes-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px;flex-wrap:wrap;gap:8px}
  .axes-head h3{font-size:16px}
  .axes-head .wnote{font-size:12px;color:var(--ink-faint)}
  .axes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .axis{padding:18px;display:flex;flex-direction:column;gap:12px}
  .axis-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .axis-h .a-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .axis-h .a-name .ai{width:26px;height:26px;flex:none;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .axis-h .a-name .ai svg{width:15px;height:15px}
  .a-score{text-align:right;flex:none}
  .a-score .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1}
  .a-score .w{font-size:10.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace}
  .a-bar{height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .a-bar i{display:block;height:100%;border-radius:4px}
  .a-raw{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
  .a-raw .rw{display:flex;gap:7px}
  .a-raw .rw .k{color:var(--ink-faint);flex:none}
  .a-raw .rw .val{font-family:'IBM Plex Mono',monospace;color:var(--ink)}
  .a-meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11px;padding-top:10px;border-top:1px dashed var(--line-strong)}
  .a-meta div{display:flex;flex-direction:column;gap:1px}
  .a-meta .lab{color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;font-size:9.5px}
  .a-meta .dat{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace}
  .axis.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .axis.warn .ai{background:var(--warn-soft);color:var(--warn)}
  .warn-body{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--ink)}
  .warn-body svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:1px}
  .na-body{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft)}
  .na-body .hatch{width:30px;height:30px;flex:none;border-radius:7px;border:1px solid var(--line);background-image:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 6px)}

  /* ============ COMPARAÇÃO ============ */
  .cmp-pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:end;margin-bottom:22px}
  .cmp-vs{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink-faint);padding-bottom:10px}
  .cmp-summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .cmp-sum{padding:18px;text-align:center}
  .cmp-sum .cs-n{font-weight:600;font-size:15px;margin-bottom:4px}
  .cmp-sum .cs-v{font-family:'IBM Plex Mono',monospace;font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .cmp-sum .cs-s{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
  .cmp-rows{padding:8px 20px 20px}
  .cmp-rows h3{font-size:14px;padding:14px 0 6px}
  .cmp-row{padding:13px 0;border-top:1px solid var(--line)}
  .cmp-row .cr-lbl{font-size:13px;font-weight:500;margin-bottom:9px;display:flex;justify-content:space-between}
  .cmp-row .cr-lbl .cr-delta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint)}
  .cmp-bars{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center}
  .cmp-bars .who{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint)}
  .cmp-track{position:relative;height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .cmp-track i{position:absolute;left:0;top:0;height:100%;border-radius:5px 0 0 5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;min-width:26px}
  .cmp-track.na{display:flex;align-items:center;padding-left:9px;font-size:11px;color:var(--ink-faint)}

  /* ============ PERFIS (Para você) ============ */
  .pchips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
  .pchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:8px 14px 8px 9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink-soft);box-shadow:var(--shadow)}
  .pchip:hover{border-color:var(--accent);color:var(--ink)}
  .pchip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pchip .pc-ic{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
  .pchip.sel .pc-ic{background:rgba(255,255,255,.22);color:#fff}
  .pchip .pc-ic svg{width:16px;height:16px}
  .persona-desc{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-soft);margin:6px 0 18px;max-width:74ch}
  .persona-desc svg{flex:none;width:15px;height:15px;color:var(--accent);margin-top:2px}
  .persona-desc .pw{color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-size:11px}
  .persona-top{padding:20px;margin-bottom:16px}
  .pt-badge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .pt-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .pt-score{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .pt-name{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .pt-reasons{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .pt-reasons b{color:var(--ink);font-weight:600}
  .pt-cta{margin-top:16px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent)}
  .pt-cta:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pt-cta svg{width:15px;height:15px}
  .persona-rank{padding:8px 18px 16px}
  .persona-rank h3{font-size:14px;padding:12px 0 6px}
  .prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;border-radius:8px;transition:transform .13s ease,background .13s ease}
  .prow:hover{background:var(--surface-2);transform:translateX(4px)}
  .rank,.pchip,.pt-cta,.mpop-cta{transition:transform .13s ease,background .13s ease,border-color .13s ease,color .13s ease}
  .rank:hover{transform:translateX(3px)}
  .pchip:hover{transform:translateY(-1px)}
  .prow .pr-rk{width:22px;flex:none;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink-faint);text-align:center}
  .prow.win .pr-rk{color:var(--accent)}
  .pr-bar-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .pr-name{font-weight:600;font-size:13.5px}
  .pr-bar{height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .pr-bar i{display:block;height:100%;border-radius:4px}
  .pr-reasons{font-size:11.5px;color:var(--ink-faint)}
  .pr-score{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:19px;flex:none;width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .persona-warn{padding:20px;display:flex;gap:14px;align-items:flex-start;border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
  .persona-warn>svg{flex:none;width:22px;height:22px;color:var(--warn);margin-top:2px}
  .persona-warn h3{font-size:16px;margin-bottom:4px}
  .persona-warn p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:70ch}

  /* ============ METODOLOGIA ============ */
  .method{display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:start}
  .toc{position:sticky;top:130px;font-size:13px;display:flex;flex-direction:column;gap:2px}
  .toc a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;border-left:2px solid transparent}
  .toc a:hover{background:var(--surface-2);color:var(--ink)}
  .prose{max-width:68ch}
  .prose section{padding:8px 0 26px;scroll-margin-top:150px}
  .prose h2{font-size:20px;letter-spacing:-.01em;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .prose h2 .hn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--accent);font-weight:600}
  .prose h3{font-size:14px;margin:16px 0 4px}
  .prose p{color:var(--ink-soft);margin:6px 0}
  .prose li{color:var(--ink-soft);margin:4px 0}
  .prose strong{color:var(--ink);font-weight:600}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .mini{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:15px}
  .mini h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .mini.yes h4{color:var(--accent)} .mini.no h4{color:var(--warn)}
  .mini p{font-size:12.5px;margin:2px 0}
  .formula{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 15px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);margin:10px 0;overflow-x:auto;white-space:nowrap}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;background:var(--surface-2)}
  tr:last-child td{border-bottom:0}
  td .mono{font-size:11.5px;color:var(--ink-soft)}
  .limit{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .limit:last-child{border-bottom:0}
  .limit .lm-ic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center}
  .limit .lm-ic svg{width:15px;height:15px}
  .limit b{font-size:13.5px}
  .limit p{margin:2px 0 0;font-size:12.5px}

  .foot{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:12px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

  /* ============ CAPA (abertura) ============ */
  .cover{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;min-height:calc(100vh - 150px);padding:10px 0 40px;
    background:radial-gradient(115% 85% at 88% 18%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 55%)}
  .cov-left{max-width:37rem}
  .cov-badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;font-family:'IBM Plex Mono',monospace;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);padding:6px 12px;border-radius:999px;margin-bottom:20px;animation:covrise .6s .05s both}
  .cov-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:covpulse 2s ease-in-out infinite}
  .cov-logo{display:none;height:clamp(52px,7vw,80px);width:auto;max-width:100%;margin-bottom:14px;animation:covrise .6s .12s both}
  .cl-light{display:block}
  .cl-dark{display:none}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cl-light{display:none}:root:not([data-theme="light"]) .cl-dark{display:block}}
  :root[data-theme="dark"] .cl-light{display:none}
  :root[data-theme="dark"] .cl-dark{display:block}
  :root[data-theme="light"] .cl-light{display:block}
  :root[data-theme="light"] .cl-dark{display:none}
  .cov-tag{font-family:'Archivo','IBM Plex Sans',sans-serif;font-size:clamp(19px,2.4vw,24px);font-weight:700;letter-spacing:-.02em;margin-bottom:14px;animation:covrise .6s .18s both}
  .cov-tag strong{color:var(--accent)}
  .cov-sub{font-size:16px;line-height:1.6;color:var(--ink-soft);max-width:46ch;margin-bottom:22px;animation:covrise .6s .2s both}
  .cov-sub strong{color:var(--ink)}
  .cov-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .cov-chip{font-size:12px;font-weight:500;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;animation:covrise .5s both}
  .cov-enter{display:inline-flex;align-items:center;gap:9px;border:0;background:var(--accent);color:#fff;font-family:inherit;font-size:15.5px;font-weight:600;padding:13px 22px;border-radius:12px;cursor:pointer;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 34%,transparent);animation:covrise .6s .3s both;transition:transform .14s ease,box-shadow .14s ease}
  .cov-enter:hover{transform:translateY(-2px);box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 46%,transparent)}
  .cov-enter svg{transition:transform .14s ease}
  .cov-enter:hover svg{transform:translateX(3px)}
  .cov-note{font-size:12px;color:var(--ink-faint);margin-top:16px;max-width:44ch;animation:covrise .6s .4s both}
  .cov-right{position:relative;display:flex;justify-content:center}
  .cov-map{width:100%;height:auto;max-height:72vh;filter:drop-shadow(0 22px 42px rgba(0,0,0,.14))}
  .cov-shape{fill:var(--map-soro-fill);stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;animation:covfade 1s ease both}
  .cov-pin{animation:pindrop .55s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes covrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes covpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
  @keyframes covfade{from{opacity:0}to{opacity:1}}
  @keyframes pindrop{0%{opacity:0;transform:translateY(-16px) scale(.55)}70%{transform:translateY(2px) scale(1.06)}100%{opacity:1;transform:none}}
  .pin.drop{animation:pindrop .5s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center}
  @media (prefers-reduced-motion:reduce){
    .cov-badge,.cov-title,.cov-sub,.cov-chip,.cov-enter,.cov-note,.cov-pin,.cov-shape,.pin.drop,.cov-badge .dot{animation:none!important}
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:900px){
    .map-grid{grid-template-columns:1fr}
    .region-top{grid-template-columns:1fr}
    .axes{grid-template-columns:1fr}
    .method{grid-template-columns:1fr}
    .toc{position:static;flex-direction:row;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
    .two-col{grid-template-columns:1fr}
    .cover{grid-template-columns:1fr;min-height:0;gap:18px;text-align:left}
    .cov-right{order:-1}
    .cov-map{max-height:38vh}
  }
  @media (max-width:560px){
    .cmp-pickers{grid-template-columns:1fr;gap:10px}
    .cmp-vs{display:none}
    .cmp-summary{grid-template-columns:1fr}
    .brand-txt .b1{font-size:13.5px}
    .tab{margin-right:15px;font-size:13px}
  }

function pontuarPerfil(id,persona){
  var pesos=persona.pesos, disp=[], somaPeso=0;
  for(var c in pesos){ var v=criterio(id,c); if(v!=null){ disp.push([c,pesos[c],v]); somaPeso+=pesos[c]; } }
  if(!disp.length||somaPeso===0) return {score:null,top:[]};
  var score=0, contribs=[];
  disp.forEach(function(d){ var w=d[1]/somaPeso; score+=w*d[2]; contribs.push({crit:d[0],val:d[2],contrib:w*d[2]}); });
  contribs.sort(function(a,b){return b.contrib-a.contrib;});
  return {score:Math.round(score), top:contribs.slice(0,2)};
}
function rankPerfil(persona){
  return ORDER.map(function(id){ var p=pontuarPerfil(id,persona); return {id:id,score:p.score,top:p.top}; })
    .filter(function(x){return x.score!=null;})
    .sort(function(a,b){return b.score-a.score;});
}

/* -------- helpers de cálculo (espelham a metodologia do MVP) -------- */
function availAxes(r){ return MEASURABLE.filter(function(k){ return r.scores[k]!=null; }); }
function composite(r){
  var a=availAxes(r); if(!a.length) return null;
  var s=a.reduce(function(t,k){return t+r.scores[k];},0);
  return Math.round(s/a.length);
}
function weightPct(r){ return 100/availAxes(r).length; }
function reliability(r){ return {have:availAxes(r).length, exp:MEASURABLE.length}; }
function metricValue(r,metric){ return metric==="composto" ? composite(r) : r.scores[metric]; }

/* -------- rampa de cor: um único matiz (teal), contínua -------- */
function themeMode(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a==="dark") return "dark";
  if(a==="light") return "light";
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function ramp(t){ // t 0..1 -> rgb string usando --ramp-lo/mid/hi do tema atual
  t=Math.max(0,Math.min(1,t));
  var lo=cssVar("--ramp-lo").split(",").map(Number);
  var mid=cssVar("--ramp-mid").split(",").map(Number);
  var hi=cssVar("--ramp-hi").split(",").map(Number);
  var c0,c1,f;
  if(t<=0.5){c0=lo;c1=mid;f=t/0.5;} else {c0=mid;c1=hi;f=(t-0.5)/0.5;}
  var r=Math.round(c0[0]+(c1[0]-c0[0])*f);
  var g=Math.round(c0[1]+(c1[1]-c0[1])*f);
  var b=Math.round(c0[2]+(c1[2]-c0[2])*f);
  return "rgb("+r+","+g+","+b+")";
}
function fillFor(val){ return val==null ? "url(#hatch)" : ramp(val/100); }
function textOn(val){
  if(val==null) return cssVar("--ink-soft");
  var lo=cssVar("--ramp-lo").split(",").map(Number),mid=cssVar("--ramp-mid").split(",").map(Number),hi=cssVar("--ramp-hi").split(",").map(Number);
  var t=val/100,c0,c1,f; if(t<=0.5){c0=lo;c1=mid;f=t/0.5;}else{c0=mid;c1=hi;f=(t-0.5)/0.5;}
  var r=c0[0]+(c1[0]-c0[0])*f,g=c0[1]+(c1[1]-c0[1])*f,b=c0[2]+(c1[2]-c0[2])*f;
  var L=(0.299*r+0.587*g+0.114*b)/255;
  return L>0.58 ? "#0d201d" : "#f2faf8";
}

function animateCounts(root){
  if(reduzMovimento()) return;
  var els=(root||document).querySelectorAll("[data-count]");
  Array.prototype.forEach.call(els,function(el){
    var target=parseFloat(el.getAttribute("data-count")); if(isNaN(target)) return;
    var dur=700, start=null;
    el.textContent="0";
    function step(ts){ if(!start)start=ts; var t=Math.min((ts-start)/dur,1);
      var e=1-Math.pow(1-t,3); el.textContent=Math.round(target*e);
      if(t<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });
}

    b.addEventListener("click",function(){ if(b.dataset.tab==="mapa") animatePins=true; state.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  });
}

/* =================== NOTICE (persistente) =================== */
function noticeHTML(){
  return '<div class="notice">'+svgIcon("info",'width="16" height="16"')+
    '<div><b>Protótipo de interface.</b> Todos os números exibidos são ilustrativos, só para validar o layout e as interações. '+
    'Os valores reais virão do pipeline de dados (IBGE, INEP, CNES, OpenStreetMap) — enquanto uma fonte não for carregada, o indicador aparece como <b>indisponível</b>, nunca preenchido.</div></div>';
}

/* =================== TELA 1 · MAPA =================== */
function renderMapa(){
  var m=state.mapMetric;
  var segs=METRICS.map(function(x){return '<button data-m="'+x[0]+'" aria-pressed="'+(m===x[0])+'">'+x[1]+'</button>';}).join("");

  // pinos sobre a silhueta real (posições geográficas reais)
  var drop = animatePins && !reduzMovimento();
  var pinsSVG=ORDER.map(function(id,i){
    var r=REGIONS[id]; var v=metricValue(r,m); var p=PINS[id];
    var fill=fillFor(v); var tcol=textOn(v); var vs=v==null?"s/d":v;
    var sel=state.popup===id?" sel":"";
    var valFont=v==null?'style="font-size:11px"':'';
    var lbl=PIN_LBL[id]||{dx:0,dy:33,a:"middle"};
    var dropAttr = drop ? ' style="animation-delay:'+(i*0.06).toFixed(2)+'s"' : '';
    return '<g class="pin'+sel+(drop?' drop':'')+'"'+dropAttr+' data-id="'+id+'" tabindex="0" role="button" aria-label="'+r.name+', '+(m==="composto"?"índice":metricLabel(m))+' '+(v==null?"sem dado":v)+'. Abrir informações">'+
      '<circle class="pin-halo" cx="'+p[0]+'" cy="'+p[1]+'" r="26"/>'+
      '<circle class="pin-dot" cx="'+p[0]+'" cy="'+p[1]+'" r="19" fill="'+fill+'"/>'+
      '<text class="pin-val" '+valFont+' x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" fill="'+tcol+'">'+vs+'</text>'+
      '<text class="pin-name" x="'+(p[0]+lbl.dx)+'" y="'+(p[1]+lbl.dy)+'" text-anchor="'+lbl.a+'" fill="var(--ink)">'+r.name+'</text></g>';
  }).join("");

  var svg='<svg class="mapsvg" viewBox="0 0 '+MAP_VB[0]+' '+MAP_VB[1]+'" role="group" aria-label="Mapa real de Sorocaba com as regiões-piloto">'+
    '<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
      '<rect width="7" height="7" fill="var(--map-void)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--line-strong)" stroke-width="2"/></pattern>'+
      '<clipPath id="mapclip"><rect x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" rx="10"/></clipPath>'+
      '<filter id="pinsh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.3"/></filter></defs>'+
    '<g clip-path="url(#mapclip)"><image href="'+MAP_IMG+'" x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" preserveAspectRatio="xMidYMid slice"/>'+
      '<rect x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" fill="var(--map-veil)"/></g>'+
    '<g filter="url(#pinsh)">'+pinsSVG+'</g></svg>';

  // popup — reage ao filtro selecionado
  var popupHTML="";
  if(state.popup && REGIONS[state.popup]){
    var pr=REGIONS[state.popup]; var pp=PINS[state.popup];
    var prel=reliability(pr); var comp=composite(pr);
    var pv=metricValue(pr,m);                       // valor do FILTRO atual (muda!)
    var mlabel=m==="composto"?"Índice composto":metricLabel(m);
    var axline=MEASURABLE.map(function(k){
      var val=pr.scores[k];
      var nm={servicos:"Serviços",mobilidade:"Mobilidade",caminhabilidade:"Caminhab.",ambiente:"Meio amb."}[k];
      var on=(k===m)?" on":"";
      if(val==null) return '<div class="mpax'+on+'"><span class="k">'+nm+'</span><div class="bar"></div><span class="vv na">s/d</span></div>';
      return '<div class="mpax'+on+'"><span class="k">'+nm+'</span><div class="bar"><i style="width:'+val+'%;background:'+ramp(val/100)+'"></i></div><span class="vv">'+val+'</span></div>';
    }).join("");
    var compChip = m==="composto" ? "" :
      '<div class="mpop-comp">Índice composto: <b>'+comp+'</b> / 100</div>';
    popupHTML='<div class="mpop" style="left:'+(pp[0]/MAP_VB[0]*100)+'%;top:'+(pp[1]/MAP_VB[1]*100)+'%" role="dialog" aria-label="Informações de '+pr.name+'">'+
      '<div class="mpop-h"><span class="mp-sw" style="background:'+fillFor(pv)+';color:'+textOn(pv)+'">'+(pv==null?"s/d":pv)+'</span>'+
        '<span class="mp-t"><span class="n">'+pr.name+'</span><span class="s">'+mlabel+' · '+prel.have+'/'+prel.exp+' eixos</span></span>'+
        '<button class="mpop-close" data-close="1" aria-label="Fechar">'+svgIcon("close",'width="18" height="18"')+'</button></div>'+
      '<div class="mpop-axes">'+axline+'</div>'+compChip+
      '<button class="mpop-cta" data-open="'+state.popup+'">Ver detalhes da região '+svgIcon("chev",'width="15" height="15"')+'</button></div>';
  }

  // legenda
  var gstops=[]; for(var i=0;i<=10;i++){ gstops.push(ramp(i/10)+" "+(i*10)+"%"); }
  var legend='<div class="legend"><span class="cap">Cor dos pinos · '+(m==="composto"?"índice composto":metricLabel(m))+'</span>'+
    '<div style="flex:1;min-width:180px"><div class="bar" style="background:linear-gradient(90deg,'+gstops.join(",")+')"></div>'+
    '<div class="ends"><span>0 · menor acesso</span><span>100 · maior acesso</span></div></div>'+
    '<span class="hatch-key"><span class="hatch-swatch"></span>sem dado</span></div>';

  // lista lateral
  var sorted=ORDER.slice().sort(function(a,b){
    var va=metricValue(REGIONS[a],m), vb=metricValue(REGIONS[b],m);
    if(va==null)return 1; if(vb==null)return -1; return vb-va;
  });
  var rows=sorted.map(function(id){
    var r=REGIONS[id]; var v=metricValue(r,m); var rel=reliability(r);
    var sel=state.popup===id?" sel":""; var na=v==null?" na":"";
    var valHTML = v==null ? '<span class="rk-val">indisponível</span>' :
      '<span class="rk-val">'+v+'<small>/100</small></span>';
    return '<button class="rank'+sel+na+'" data-pin="'+id+'">'+
      '<span class="swatch" style="background:'+fillFor(v)+'"></span>'+
      '<span class="rk-name"><span class="n">'+r.name+'</span><span class="s">'+rel.have+'/'+rel.exp+' eixos · '+r.setores.length+' setores</span></span>'+
      valHTML+'<span class="chev">'+svgIcon("chev",'width="16" height="16"')+'</span></button>';
  }).join("");

  var html=noticeHTML()+
    '<div class="screen"><div class="map-head">'+
      '<div><span class="eyebrow">Mapa</span><h2>Radiografia por região</h2>'+
      '<p class="lead">Não é um ranking de bairro bom ou ruim. É a leitura de <strong>acesso a serviços e infraestrutura</strong>. Troque o <strong>filtro</strong> abaixo para recolorir os pinos por eixo, e clique num <strong>pino</strong> para abrir a região:</p></div>'+
      '<div class="seg" role="group" aria-label="Métrica dos pinos">'+segs+'</div>'+
    '</div>'+
    '<div class="map-grid">'+
      '<div><div class="card map-card"><div class="map-stage">'+svg+popupHTML+'</div>'+
        '<span class="soro-cap">Mapa: Google Maps&nbsp;&nbsp;|&nbsp;&nbsp;pinos nas regiões-piloto (posição ilustrativa)</span></div>'+
        '<p class="map-hint">Toque num pino no mapa ou numa região na lista →</p></div>'+
      '<div class="card ranklist"><h3>Regiões-piloto</h3>'+rows+'</div>'+
    '</div></div>';

  document.getElementById("app").innerHTML=html;

  // eventos
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){
    b.addEventListener("click",function(){ state.mapMetric=b.dataset.m; renderMapa(); });
  });
  function togglePop(id){ state.popup = (state.popup===id? null : id); renderMapa(); }
  function openRegion(id){ state.region=id; state.tab="regiao"; state.popup=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  Array.prototype.forEach.call(document.querySelectorAll(".pin"),function(p){
    p.addEventListener("click",function(e){ e.stopPropagation(); togglePop(p.dataset.id); });
    p.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); togglePop(p.dataset.id); } });
    p.addEventListener("mousemove",function(e){ if(state.popup!==p.dataset.id) showTip(e,p.dataset.id); });
    p.addEventListener("mouseleave",hideTip);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".rank"),function(b){
    b.addEventListener("click",function(){ state.popup=b.dataset.pin; renderMapa(); });
  });
  var closeBtn=document.querySelector(".mpop-close");
  if(closeBtn) closeBtn.addEventListener("click",function(){ state.popup=null; renderMapa(); });
  var ctaBtn=document.querySelector(".mpop-cta");
  if(ctaBtn) ctaBtn.addEventListener("click",function(){ openRegion(ctaBtn.dataset.open); });
  hideTip();
  animatePins=false;
}

/* tooltip */
var tipEl=document.getElementById("tip");
function showTip(e,id){
  var r=REGIONS[id]; var m=state.mapMetric; var v=metricValue(r,m); var rel=reliability(r);
  tipEl.innerHTML='<div class="t-n">'+r.name+'</div>'+
    '<div class="t-v">'+(m==="composto"?"Índice composto":metricLabel(m))+': '+(v==null?"sem dado":v+" / 100")+'</div>'+
    '<div class="t-s">'+rel.have+'/'+rel.exp+' eixos calculados · clique para detalhar</div>';
  tipEl.classList.add("on");
  var pad=14, w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  var x=e.clientX+pad, y=e.clientY+pad;
  if(x+w>window.innerWidth-8) x=e.clientX-w-pad;
  if(y+h>window.innerHeight-8) y=e.clientY-h-pad;
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px";
}
function hideTip(){ tipEl.classList.remove("on"); }

/* =================== TELA 2 · REGIÃO =================== */
function pickerHTML(id,label,value,handlerAttr){
  var opts=ORDER.map(function(k){return '<option value="'+k+'"'+(k===value?" selected":"")+'>'+REGIONS[k].name+'</option>';}).join("");
  return '<div class="picker"><span class="pl">'+label+'</span><select '+handlerAttr+'>'+opts+'</select>'+
    '<span class="ic">'+svgIcon("down",'width="18" height="18"')+'</span></div>';
}

function renderRegiao(){
  var r=REGIONS[state.region]; var comp=composite(r); var rel=reliability(r); var w=weightPct(r);
  var relPct=Math.round(rel.have/rel.exp*100);

  var setoresChips=r.setores.map(function(s){return '<span class="chip">'+s+'</span>';}).join("");

  var axesHTML=AXES.map(function(ax){
    if(ax.key==="pcd"){
      return '<div class="card axis warn">'+
        '<div class="axis-h"><div class="a-name"><span class="ai">'+svgIcon(ax.icon)+'</span>'+ax.label+'</div></div>'+
        '<div class="warn-body">'+svgIcon("warn",'width="16" height="16"')+
        '<div>⚠️ <strong>Dados insuficientes para calcular este indicador.</strong><br>Eixo mantido na interface, sem nota, até existir base confiável de acessibilidade (rampas, piso tátil, semáforo sonoro).</div></div></div>';
    }
    var v=r.scores[ax.key];
    if(v==null){
      return '<div class="card axis">'+
        '<div class="axis-h"><div class="a-name"><span class="ai">'+svgIcon(ax.icon)+'</span>'+ax.label+'</div>'+
        '<div class="a-score"><div class="v" style="color:var(--ink-faint)">—</div><div class="w">peso 0%</div></div></div>'+
        '<div class="na-body"><span class="hatch"></span><div><strong>Indicador indisponível nesta região.</strong> Área verde ainda não mapeada aqui — '+
        'o peso deste eixo foi <strong>redistribuído</strong> entre os '+rel.have+' eixos com dado ('+w.toFixed(1).replace(".",",")+'% cada).</div></div>'+
        '<div class="a-meta"><div><span class="lab">Fonte</span><span class="dat">'+ax.source+'</span></div>'+
        '<div><span class="lab">Fórmula</span><span class="dat">'+ax.formula+'</span></div></div></div>';
    }
    var rawRows="";
    if(ax.key==="servicos"){
      rawRows='<div class="rw"><span class="k">Saúde</span><span class="val">'+r.raw.saude+'</span></div>'+
        '<div class="rw"><span class="k">Educação</span><span class="val">'+r.raw.educacao+'</span></div>'+
        '<div class="rw"><span class="k">Comércio</span><span class="val">'+r.raw.comercio+'</span></div>';
    } else {
      rawRows='<div class="rw"><span class="k">Medido</span><span class="val">'+r.raw[ax.key]+'</span></div>';
    }
    return '<div class="card axis">'+
      '<div class="axis-h"><div class="a-name"><span class="ai">'+svgIcon(ax.icon)+'</span>'+ax.label+'</div>'+
      '<div class="a-score"><div class="v" style="color:'+ramp(v/100)+'">'+v+'</div><div class="w">peso '+w.toFixed(1).replace(".",",")+'%</div></div></div>'+
      '<div class="a-bar"><i style="width:'+v+'%;background:'+ramp(v/100)+'"></i></div>'+
      '<div class="a-raw">'+rawRows+'</div>'+
      '<div class="a-meta"><div><span class="lab">Fonte</span><span class="dat">'+ax.source+'</span></div>'+
      '<div><span class="lab">Data</span><span class="dat">'+ax.date+'</span></div>'+
      '<div><span class="lab">Fórmula</span><span class="dat">'+ax.formula+'</span></div></div></div>';
  }).join("");

  var html=noticeHTML()+'<div class="screen">'+
    '<span class="eyebrow">Região</span>'+
    '<div class="sel-row">'+pickerHTML("region","Região selecionada",state.region,'id="regSelect"')+
    '<span class="lead" style="margin:0">Índice, detalhamento por eixo e a origem de cada número.</span></div>'+

    '<div class="region-top">'+
      '<div class="card index-card">'+
        '<span class="ic-eye">Índice de Infraestrutura Urbana</span>'+
        '<div class="gauge"><span class="num" data-count="'+comp+'" style="color:'+ramp(comp/100)+'">'+comp+'</span><span class="den">/ 100</span></div>'+
        '<div class="gauge-track"><div class="gauge-fill" style="width:'+comp+'%;background:'+ramp(comp/100)+'"></div></div>'+
        '<div class="seal"><span class="ring" style="--p:'+relPct+'"><i>'+relPct+'%</i></span>'+
          '<span class="st"><b>Selo de confiabilidade</b><span>'+rel.have+' de '+rel.exp+' eixos calculados nesta região</span></span></div>'+
      '</div>'+
      '<div class="card setores-card">'+
        '<h3>'+r.name+' · composição</h3>'+
        '<p>Esta região-piloto agrega '+r.setores.length+' setores censitários do IBGE (Censo 2022):</p>'+
        '<div class="chips">'+setoresChips+'</div>'+
        '<div class="note">'+svgIcon("info",'width="14" height="14"')+'<span>A composição de cada região vive num arquivo de configuração legível (<span class="mono">regions.yaml</span>), não espalhada pelo código — assim qualquer pessoa audita o recorte.</span></div>'+
      '</div>'+
    '</div>'+

    '<div class="axes-head"><h3>Eixos do índice</h3>'+
      '<span class="wnote">Peso igual entre eixos com dado · quando falta um eixo, o peso é redistribuído (nunca zerado)</span></div>'+
    '<div class="axes">'+axesHTML+'</div>'+
  '</div>';

  document.getElementById("app").innerHTML=html;
  animateCounts(document.getElementById("app"));
  document.getElementById("regSelect").addEventListener("change",function(e){ state.region=e.target.value; renderRegiao(); });
}

/* =================== TELA 3 · COMPARAÇÃO =================== */
function renderComparacao(){
  var A=REGIONS[state.cmpA], B=REGIONS[state.cmpB];
  var cA=composite(A), cB=composite(B);

  function sumCard(r,c){
    var rel=reliability(r);
    return '<div class="card cmp-sum"><div class="cs-n">'+r.name+'</div>'+
      '<div class="cs-v" style="color:'+ramp(c/100)+'">'+c+'</div>'+
      '<div class="cs-s">índice composto · '+rel.have+'/'+rel.exp+' eixos</div></div>';
  }

  var rowsHTML=MEASURABLE.map(function(k){
    var ax=null; for(var i=0;i<AXES.length;i++)if(AXES[i].key===k)ax=AXES[i];
    var va=A.scores[k], vb=B.scores[k];
    function bar(who,v){
      if(v==null) return '<span class="who">'+who+'</span><div class="cmp-track na">sem dado nesta região</div>';
      return '<span class="who">'+who+'</span><div class="cmp-track"><i style="width:'+Math.max(v,3)+'%;background:'+ramp(v/100)+'">'+v+'</i></div>';
    }
    var delta = (va!=null&&vb!=null) ? (va-vb) : null;
    var deltaTxt = delta==null ? "—" : (delta>0?"+":"")+delta+" p/ "+(delta>0?A.name:delta<0?B.name:"empate");
    return '<div class="cmp-row"><div class="cr-lbl">'+ax.label+'<span class="cr-delta">Δ '+deltaTxt+'</span></div>'+
      '<div class="cmp-bars">'+bar("A",va)+bar("B",vb)+'</div></div>';
  }).join("");

  var html=noticeHTML()+'<div class="screen">'+
    '<span class="eyebrow">Comparação</span>'+
    '<h2 style="font-size:22px;letter-spacing:-.02em;margin:2px 0 4px">Duas regiões, lado a lado</h2>'+
    '<p class="lead" style="margin-bottom:18px">Comparar acesso, eixo a eixo — para conversar sobre onde a infraestrutura chega e onde ainda não chega. Sem vencedor: só a leitura.</p>'+
    '<div class="cmp-pickers">'+
      pickerHTML("cmpA","Região A",state.cmpA,'id="cmpASelect"')+
      '<span class="cmp-vs">vs</span>'+
      pickerHTML("cmpB","Região B",state.cmpB,'id="cmpBSelect"')+
    '</div>'+
    '<div class="cmp-summary">'+sumCard(A,cA)+sumCard(B,cB)+'</div>'+
    '<div class="card cmp-rows"><h3>Por eixo</h3><p class="lead" style="font-size:12.5px;margin:0 0 4px">A = '+A.name+' · B = '+B.name+'</p>'+rowsHTML+'</div>'+
  '</div>';

  document.getElementById("app").innerHTML=html;
  document.getElementById("cmpASelect").addEventListener("change",function(e){ state.cmpA=e.target.value; renderComparacao(); });
  document.getElementById("cmpBSelect").addEventListener("change",function(e){ state.cmpB=e.target.value; renderComparacao(); });
}

/* =================== TELA 4 · PARA VOCÊ (perfis) =================== */
function renderPerfis(){
  var persona=null; for(var i=0;i<PERSONAS.length;i++) if(PERSONAS[i].key===state.persona) persona=PERSONAS[i];
  if(!persona) persona=PERSONAS[0];

  var chips=PERSONAS.map(function(p){
    var sel=p.key===state.persona?" sel":"";
    return '<button class="pchip'+sel+'" data-persona="'+p.key+'"><span class="pc-ic">'+svgIcon(p.icon)+
      '</span><span class="pc-n">'+p.nome+'</span></button>';
  }).join("");

  var pesosTxt="";
  if(!persona.indisponivel){
    var parts=[]; for(var c in persona.pesos) parts.push(CRIT_LABEL[c]+" "+Math.round(persona.pesos[c]*100)+"%");
    pesosTxt=parts.join(" · ");
  }

  var body;
  if(persona.indisponivel){
    body='<div class="card persona-warn">'+svgIcon("warn",'width="22" height="22"')+
      '<div><h3>Ainda não dá para recomendar por acessibilidade.</h3>'+
      '<p>Este é o eixo em que o projeto escolhe ser honesto: não existe base confiável de rampas, '+
      'piso tátil e semáforo sonoro por região em Sorocaba. Recomendar aqui seria inventar dado. '+
      'Assim que a fonte existir, este perfil passa a funcionar como os outros.</p></div></div>';
  } else {
    var rank=rankPerfil(persona); var top=rank[0]; var tr=REGIONS[top.id];
    var reasons=top.top.map(function(t){return CRIT_LABEL[t.crit];});
    var winner='<div class="card persona-top">'+
      '<span class="pt-badge">Melhor para '+persona.nome.toLowerCase()+'</span>'+
      '<div class="pt-main"><span class="pt-score" data-count="'+top.score+'" style="color:'+ramp(top.score/100)+'">'+top.score+'</span>'+
        '<div class="pt-info"><div class="pt-name">'+tr.name+'</div>'+
        '<div class="pt-reasons">Se destaca em <b>'+reasons.join('</b> e <b>')+'</b> — os critérios que mais pesam para este perfil.</div>'+
        '<button class="pt-cta" data-region="'+top.id+'">Ver a região '+svgIcon("chev")+'</button></div></div></div>';
    var list=rank.map(function(x,i){
      var r=REGIONS[x.id];
      var rs=x.top.map(function(t){return CRIT_LABEL[t.crit];}).join(", ");
      return '<button class="prow'+(i===0?' win':'')+'" data-region="'+x.id+'">'+
        '<span class="pr-rk">'+(i+1)+'</span>'+
        '<span class="pr-bar-wrap"><span class="pr-name">'+r.name+'</span>'+
        '<span class="pr-bar"><i style="width:'+x.score+'%;background:'+ramp(x.score/100)+'"></i></span>'+
        '<span class="pr-reasons">força em: '+rs+'</span></span>'+
        '<span class="pr-score">'+x.score+'</span></button>';
    }).join("");
    body=winner+'<div class="card persona-rank"><h3>Ranking das regiões para este perfil</h3>'+list+'</div>';
  }

  var html=noticeHTML()+'<div class="screen">'+
    '<span class="eyebrow">Para você</span>'+
    '<h2 style="font-size:23px;letter-spacing:-.02em;margin:2px 0 4px">Qual região combina com você?</h2>'+
    '<p class="lead" style="margin-bottom:6px">Cada pessoa precisa de coisas diferentes da cidade. Escolha um perfil e veja quais regiões, <strong>pelos dados</strong>, oferecem melhor o que ele mais precisa. Não é conselho de onde morar — é leitura de acesso.</p>'+
    '<div class="pchips" role="group" aria-label="Perfis">'+chips+'</div>'+
    '<p class="persona-desc">'+svgIcon("info",'width="15" height="15"')+'<span>'+persona.desc+
      (pesosTxt?' &nbsp; <span class="pw">pesos: '+pesosTxt+'</span>':'')+'</span></p>'+
    body+
  '</div>';

  document.getElementById("app").innerHTML=html;
  animateCounts(document.getElementById("app"));
  Array.prototype.forEach.call(document.querySelectorAll(".pchip"),function(b){
    b.addEventListener("click",function(){ state.persona=b.dataset.persona; renderPerfis(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-region]"),function(b){
    b.addEventListener("click",function(){ state.region=b.dataset.region; state.tab="regiao"; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  });
}

/* =================== TELA 5 · METODOLOGIA =================== */
function renderMetodologia(){
  var html=noticeHTML()+'<div class="screen"><span class="eyebrow">Metodologia</span>'+
  '<h2 style="font-size:24px;letter-spacing:-.02em;margin:2px 0 6px">Como cada nota é construída</h2>'+
  '<p class="lead" style="margin-bottom:22px">A régua é a transparência: toda nota deve poder ser refeita à mão por qualquer pessoa, a partir de um dado público, uma fórmula e uma data.</p>'+
  '<div class="method">'+
    '<nav class="toc" aria-label="Seções">'+
      '<a href="#m-oque">O que é / não é</a>'+
      '<a href="#m-calculo">Como calculamos</a>'+
      '<a href="#m-eixos">Eixos e indicadores</a>'+
      '<a href="#m-fontes">Fontes e datas</a>'+
      '<a href="#m-limites">Limitações</a>'+
    '</nav>'+
    '<div class="prose">'+

    '<section id="m-oque"><h2><span class="hn">01</span>O que é — e o que não é</h2>'+
      '<div class="two-col">'+
        '<div class="mini yes"><h4>'+svgIcon("info",'width="15" height="15"')+' É</h4>'+
          '<p>Uma radiografia transparente de acesso a serviços e infraestrutura.</p>'+
          '<p>Cada nota é rastreável até um dado público real.</p>'+
          '<p>Uma ferramenta para conversar sobre a cidade.</p></div>'+
        '<div class="mini no"><h4>'+svgIcon("warn",'width="15" height="15"')+' Não é</h4>'+
          '<p>Um ranking de "bairro bom ou ruim".</p>'+
          '<p>Uma medida de valor imobiliário ou de segurança.</p>'+
          '<p>Um dado oficial da Prefeitura.</p></div>'+
      '</div></section>'+

    '<section id="m-calculo"><h2><span class="hn">02</span>Como o índice é calculado</h2>'+
      '<h3>1 · Normalização (min-max, 0–100)</h3>'+
      '<p>Cada indicador é reescalado entre as regiões-piloto: a menor vira 0, a maior vira 100. Onde <strong>menor é melhor</strong> (ex.: distância até o mercado), a fórmula é invertida.</p>'+
      '<div class="formula">norma = ( valor − mín ) / ( máx − mín ) × 100&nbsp;&nbsp;&nbsp;// invertido quando "menor é melhor"</div>'+
      '<h3>2 · Pesos com redistribuição</h3>'+
      '<p>Os eixos com dado disponível têm <strong>peso igual</strong>. Se um eixo não tem dado numa região, seu peso é redistribuído proporcionalmente entre os demais — <strong>nunca fixado em zero</strong>, o que puniria a região por uma lacuna de dado.</p>'+
      '<div class="formula">índice = média( eixos com dado )&nbsp;&nbsp;•&nbsp;&nbsp;4 eixos → 25% cada&nbsp;&nbsp;|&nbsp;&nbsp;3 eixos → 33,3% cada</div>'+
      '<h3>3 · Selo de confiabilidade</h3>'+
      '<p>Toda região carrega um selo = <strong>eixos calculados ÷ eixos esperados</strong>. Um índice alto com selo baixo avisa: há poucos dados por trás dele.</p>'+
      '<h3>4 · Cor do mapa</h3>'+
      '<p>Um <strong>único matiz</strong> (teal), em intensidade contínua — deliberadamente <strong>não</strong> vermelho/verde, para não sugerir "reprovado/aprovado". Mais intenso = maior acesso medido.</p></section>'+

    '<section id="m-eixos"><h2><span class="hn">03</span>Eixos e indicadores</h2>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Eixo</th><th>Indicador</th><th>Direção</th></tr></thead><tbody>'+
      '<tr><td>Serviços essenciais</td><td>Média de: UBS por 10.000 hab.; % da pop. a ≤1 km de escola; distância média a mercado/farmácia</td><td>maior é melhor<br><span class="mono">(distância invertida)</span></td></tr>'+
      '<tr><td>Mobilidade</td><td>% da população a ≤ 400 m de um ponto de ônibus</td><td>maior é melhor</td></tr>'+
      '<tr><td>Acesso urbano</td><td>Densidade de interseções de rua por km² (proxy de caminhabilidade)</td><td>maior é melhor</td></tr>'+
      '<tr><td>Meio ambiente</td><td>m² de área verde mapeada por habitante</td><td>maior é melhor</td></tr>'+
      '<tr><td>Acessibilidade · PCD</td><td class="mono">Sem cálculo no MVP — exibido como "dados insuficientes"</td><td>—</td></tr>'+
      '</tbody></table></div></section>'+

    '<section id="m-fontes"><h2><span class="hn">04</span>Fontes e datas</h2>'+
      '<p>Fontes confirmadas do projeto. Onde uma fonte não existe (ex.: GTFS da URBES, portal geoespacial da Prefeitura), o indicador fica indisponível — não é simulado.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Dado</th><th>Fonte</th><th>Formato</th></tr></thead><tbody>'+
      '<tr><td>Geometria dos setores</td><td>IBGE · Malha de Setores Censitários 2022</td><td class="mono">Shapefile</td></tr>'+
      '<tr><td>População por setor</td><td>IBGE · Censo 2022 (agregados por setor)</td><td class="mono">CSV</td></tr>'+
      '<tr><td>Escolas</td><td>INEP · Catálogo de Escolas / Censo Escolar</td><td class="mono">CSV</td></tr>'+
      '<tr><td>Unidades de saúde</td><td>CNES / DataSUS</td><td class="mono">Web/CSV</td></tr>'+
      '<tr><td>Ônibus, vias, POIs, parques</td><td>OpenStreetMap · Overpass API</td><td class="mono">GeoJSON</td></tr>'+
      '</tbody></table></div></section>'+

    '<section id="m-limites"><h2><span class="hn">05</span>Limitações — ditas em voz alta</h2>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>Acessibilidade PCD sem base</b><p>Não há dado confiável de rampas, piso tátil ou semáforo sonoro por região. O eixo aparece, mas sem nota.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>OpenStreetMap é colaborativo</b><p>Cobertura de pontos de ônibus, comércio e parques varia por região; a qualidade precisa ser checada por amostragem.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>Sem GTFS público da URBES</b><p>Mobilidade usa proximidade a pontos (OSM), não frequência real de linhas — é um proxy, não o serviço vivido.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>Regiões são recortes, não bairros oficiais</b><p>Cada região agrega setores do IBGE sob um nome reconhecível; o recorte é uma escolha documentada, não uma fronteira legal.</p></div></div>'+
    '</section>'+

    '<div class="foot"><span>CityLens · Sorocaba · protótipo de interface</span><span class="mono">v0 · esquema visual navegável</span></div>'+
    '</div></div></div>';

  document.getElementById("app").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".toc a"),function(a){
    a.addEventListener("click",function(e){
      e.preventDefault();
      var t=document.querySelector(a.getAttribute("href"));
      if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}

/* =================== TELA 0 · CAPA =================== */
function renderCover(){
  var covPins=ORDER.map(function(id,i){
    var p=PINS[id]; var v=composite(REGIONS[id]);
    var cls=reduzMovimento()?"":"cov-pin";
    return '<circle class="'+cls+'" style="animation-delay:'+(0.35+i*0.09).toFixed(2)+'s" cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="'+ramp(v/100)+'" stroke="#fff" stroke-width="3.5"/>';
  }).join("");
  var eixos=["Serviços","Mobilidade","Caminhabilidade","Meio ambiente","Acessibilidade"];
  var chips=eixos.map(function(e,i){return '<span class="cov-chip" style="animation-delay:'+(0.5+i*0.07).toFixed(2)+'s">'+e+'</span>';}).join("");
  var svg='<svg class="cov-map" viewBox="0 0 '+MAP_VB[0]+' '+MAP_VB[1]+'" aria-hidden="true" preserveAspectRatio="xMidYMid meet">'+
    '<defs><clipPath id="covclip"><rect x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" rx="18"/></clipPath></defs>'+
    '<g clip-path="url(#covclip)"><image href="'+MAP_IMG+'" x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" preserveAspectRatio="xMidYMid slice"/>'+
      '<rect x="0" y="0" width="'+MAP_VB[0]+'" height="'+MAP_VB[1]+'" fill="var(--map-veil)"/></g>'+
    covPins+'</svg>';
  var html='<div class="cover">'+
    '<div class="cov-left">'+
      '<span class="cov-badge"><span class="dot"></span>Projeto escolar · protótipo</span>'+
      '<img class="cov-logo cl-light" src="'+LOGO_WM_LIGHT+'" alt="CityLens">'+
      '<img class="cov-logo cl-dark" src="'+LOGO_WM_DARK+'" alt="CityLens">'+
      '<p class="cov-tag">Radiografia urbana de <strong>Sorocaba</strong></p>'+
      '<p class="cov-sub">Um raio-X transparente do <strong>acesso a serviços e infraestrutura</strong>, região por região — cada nota rastreável a um dado público, uma fórmula e uma data.</p>'+
      '<div class="cov-chips">'+chips+'</div>'+
      '<button class="cov-enter" id="covEnter">Explorar o mapa '+svgIcon("chev",'width="18" height="18"')+'</button>'+
      '<p class="cov-note">Não é ranking de bairro bom ou ruim. Os números deste protótipo são ilustrativos.</p>'+
    '</div>'+
    '<div class="cov-right">'+svg+'</div>'+
  '</div>';
  document.getElementById("app").innerHTML=html;
  document.getElementById("covEnter").addEventListener("click",function(){
    state.cover=false; state.tab="mapa"; animatePins=true; render(); window.scrollTo({top:0});
  });
}

/* =================== ROUTER =================== */
function render(){
  var tabsNav=document.querySelector(".tabs");
  hideTip();
  if(state.cover){
    if(tabsNav) tabsNav.hidden=true;
    renderCover();
    return;
  }
  if(tabsNav) tabsNav.hidden=false;
  renderTabs();
  if(state.tab==="mapa") renderMapa();
  else if(state.tab==="regiao") renderRegiao();
  else if(state.tab==="comparacao") renderComparacao();
  else if(state.tab==="perfis") renderPerfis();
  else renderMetodologia();
}

/* tema */
document.getElementById("themeBtn").addEventListener("click",function(){
  var cur=themeMode();
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
  render();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
  if(!document.documentElement.getAttribute("data-theme")) render();
});

render();
</script>

<title>CityLens Sorocaba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap">

<style>
  /* ============ TOKENS ============ */
  :root{
    --paper:#E1EDF2;
    --surface:#F7FBFD;
    --surface-2:#E7F2F6;
    --ink:#123243;
    --ink-soft:#4E6675;
    --ink-faint:#80989F;
    --line:#CFE2EA;
    --line-strong:#B4D1DC;
    --accent:#1186C8;
    --accent-soft:#1186C818;
    --accent2:#2AA3C4;
    --accent2-soft:#2AA3C41e;
    --royal:#2B4ACE;
    --warn:#B5720A;
    --warn-soft:#B5720A16;
    --shadow:0 2px 4px rgba(16,56,74,.06),0 16px 36px rgba(16,56,74,.10);
    --ramp-lo:224,240,246;
    --ramp-mid:66,158,202;
    --ramp-hi:12,100,150;
    --map-void:#DCEAF0;
    --map-stroke:#F7FBFD;
    --map-land:#E3EEF3;
    --map-neighbor:#D3E4EC;
    --map-stroke2:#B4D1DC;
    --map-neighlbl:#80989F;
    --map-soro-fill:#DEEEF1;
    --map-veil:rgba(0,0,0,0);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1E2048;
      --surface:#282B5A;
      --surface-2:#222550;
      --ink:#E8EAFB;
      --ink-soft:#ADB2DA;
      --ink-faint:#8187B4;
      --line:#353A77;
      --line-strong:#454B92;
      --accent:#6E82F0;
      --accent-soft:#6E82F022;
      --accent2:#7CB4F0;
      --accent2-soft:#7CB4F022;
      --royal:#8A97FF;
      --warn:#E3A44C;
      --warn-soft:#E3A44C1c;
      --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
      --ramp-lo:30,32,70;
      --ramp-mid:104,116,230;
      --ramp-hi:150,162,255;
      --map-void:#282B5A;
      --map-stroke:#1E2048;
      --map-land:#222550;
      --map-neighbor:#2A2E63;
      --map-stroke2:#3C4186;
      --map-neighlbl:#888FC2;
      --map-soro-fill:#2B2F6B;
      --map-veil:rgba(8,8,26,0.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1E2048;
    --surface:#282B5A;
    --surface-2:#222550;
    --ink:#E8EAFB;
    --ink-soft:#ADB2DA;
    --ink-faint:#8187B4;
    --line:#353A77;
    --line-strong:#454B92;
    --accent:#6E82F0;
    --accent-soft:#6E82F022;
    --accent2:#7CB4F0;
    --accent2-soft:#7CB4F022;
    --royal:#8A97FF;
    --warn:#E3A44C;
    --warn-soft:#E3A44C1c;
    --shadow:0 2px 4px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
    --ramp-lo:30,32,70;
    --ramp-mid:104,116,230;
    --ramp-hi:150,162,255;
    --map-void:#282B5A;
    --map-stroke:#1E2048;
    --map-land:#222550;
    --map-neighbor:#2A2E63;
    --map-stroke2:#3C4186;
    --map-neighlbl:#888FC2;
    --map-soro-fill:#2B2F6B;
    --map-veil:rgba(8,8,26,0.45);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
  ::-webkit-scrollbar{width:13px;height:13px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 62%,var(--paper)));border:3px solid var(--paper);border-radius:999px;background-clip:padding-box;min-height:48px}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));border-color:var(--paper);background-clip:padding-box}
  ::-webkit-scrollbar-corner{background:transparent}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Nunito',ui-monospace,SFMono-Regular,Menlo,monospace}
  h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
  h1,h2,.cov-title,.map-head h2,.pt-name,.cmp-sum .cs-n{font-family:'Baloo 2','Nunito',system-ui,sans-serif;letter-spacing:-.02em}
  .display{font-family:'Baloo 2','Nunito',system-ui,sans-serif}
  /* números com cara de Impact */
  .num,.pin-val,.pt-score,.pr-score,.cs-v,.a-score .v,.rk-val,.mp-sw,.mpax .vv,.cmp-track i,.seal .ring i{font-family:'Anton','Nunito',sans-serif;font-weight:400;letter-spacing:.03em}
  /* cor legível e fixa nos números grandes (a intensidade fica na barra) */
  .num,.pt-score,.cs-v,.a-score .v,.rk-val,.pr-score{color:var(--accent)}
  a{color:var(--accent)}
  button{font-family:inherit}
  ::selection{background:var(--accent);color:#fff}

  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}

  /* ============ TOP BAR ============ */
  .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-inner{display:flex;align-items:center;gap:16px;height:62px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;border-radius:12px;transition:opacity .14s ease,transform .14s ease}
  .brand:hover{opacity:.82;transform:translateY(-1px)}
  .brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .glyph{width:34px;height:34px;flex:none;border-radius:9px;background:var(--royal);display:grid;place-items:center;box-shadow:var(--shadow)}
  .glyph-img{width:25px;height:25px;display:block;object-fit:contain}
  .brand-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
  .brand-txt .b1{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;letter-spacing:-.02em;font-size:16px;white-space:nowrap;color:var(--royal)}
  .brand-txt .b2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
  .spacer{flex:1}
  .mock-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);padding:5px 10px;border-radius:999px}
  .mock-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .theme-btn{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}

  /* ============ TABS ============ */
  .tabs{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);position:sticky;top:62px;z-index:30}
  .tabs-inner{display:flex;gap:8px;max-width:1180px;margin:0 auto;padding:11px 22px;width:100%;overflow-x:auto}
  .tab{appearance:none;border:1px solid var(--line);cursor:pointer;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);background:var(--surface);border-radius:999px;white-space:nowrap;transition:transform .14s ease,background .14s ease,color .14s ease,border-color .14s ease,box-shadow .14s ease}
  .tab:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}
  .tab[aria-selected="true"]{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 5px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
  .tabs-inner::-webkit-scrollbar{height:0}

  /* ============ NOTICE ============ */
  .notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:16px;padding:13px 16px;margin:20px 0 4px;font-size:13px;color:var(--ink)}
  .notice svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--accent)}
  .notice b{color:var(--accent)}

  main{padding-bottom:70px}
  .screen{padding-top:22px;animation:fade .4s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}*{scroll-behavior:auto!important}}

  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);font-weight:700;font-family:'Nunito',monospace}
  .lead{color:var(--ink-soft);font-size:14.5px;max-width:64ch}

  /* ============ CARDS ============ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}

  /* ============ MAPA ============ */
  .map-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
  .map-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
  .map-head h2{font-size:22px;letter-spacing:-.02em}
  /* Busca por bairro */
  .bsearch{position:relative;margin:0 0 18px;max-width:560px}
  .bsearch-in{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;padding:11px 13px;color:var(--ink-soft);transition:border-color .15s,box-shadow .15s}
  .bsearch-in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .bsearch-in svg{flex:none;color:var(--accent)}
  .bsearch-in input{flex:1;border:0;background:transparent;outline:none;font-family:'Nunito',sans-serif;font-size:14.5px;color:var(--ink)}
  .bsearch-in input::placeholder{color:var(--ink-soft);opacity:.75}
  .bsearch-x{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);cursor:pointer}
  .bsearch-x:hover{background:var(--line)}
  .bsearch-out{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1.5px solid var(--line-strong);border-radius:13px;box-shadow:0 14px 40px rgba(0,0,0,.16);overflow:hidden;max-height:340px;overflow-y:auto}
  .bsearch-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 13px;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--line);font-family:'Nunito',sans-serif}
  .bsearch-item:last-child{border-bottom:0}
  .bsearch-item:hover,.bsearch-item.on{background:var(--accent-soft)}
  .bsearch-item>svg:first-child{flex:none;color:var(--accent)}
  .bsearch-item>svg:last-child{flex:none;color:var(--ink-soft);margin-left:2px}
  .bi-name{flex:1;font-size:14px}
  .bi-name b{color:var(--accent)}
  .bi-ref{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle}
  .bi-zone{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:3px 9px}
  .bi-score{flex:none;font-family:'Anton','Nunito',sans-serif;font-size:15px;line-height:1;border-radius:7px;padding:5px 8px 4px;min-width:34px;text-align:center;letter-spacing:.01em}
  .bi-score small{font-size:8.5px;font-weight:400;opacity:.85;margin-left:1px}
  .bi-score.na{font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-soft)}
  .bsearch-empty{padding:13px;font-size:13.5px;color:var(--ink-soft)}
  .bsearch-empty b{color:var(--ink)}
  .seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px}
  .seg button{appearance:none;border:0;background:none;cursor:pointer;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

  .map-card{padding:14px 14px 30px;position:relative}
  .map-stage{position:relative}
  .mapsvg{width:100%;height:auto;display:block;touch-action:manipulation;overflow:hidden;border-radius:16px;background:var(--map-land)}
  .mapsvg-choro{background:var(--surface-2)}
  .setor{stroke:var(--surface);stroke-width:0.35;cursor:pointer}
  .setor:hover{stroke:var(--ink);stroke-width:1.3}
  .zlabs{pointer-events:none}
  .zlab{pointer-events:auto;cursor:pointer}
  .zlab-t{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;font-size:19px;text-anchor:middle;fill:var(--ink);paint-order:stroke}
  .zlab-o{stroke:var(--surface);stroke-width:4;stroke-linejoin:round;fill:none;opacity:.9}
  .zlab.sel .zlab-t{fill:var(--accent)}
  .map-bg{fill:var(--map-land)}
  .neigh{fill:var(--map-neighbor);stroke:var(--map-stroke2);stroke-width:1;stroke-linejoin:round}
  .neigh-lbl{fill:var(--map-neighlbl);font-size:11px;font-family:'Nunito',monospace;letter-spacing:.05em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--map-land);stroke-width:3px;stroke-linejoin:round}
  .soro-shape{fill:var(--map-soro-fill);stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
  .soro-cap{position:absolute;right:22px;bottom:22px;font-size:10.5px;color:var(--ink-soft);font-family:'Nunito',monospace;letter-spacing:.02em;max-width:70%;line-height:1.4;pointer-events:none;background:color-mix(in srgb,var(--surface) 86%,transparent);padding:5px 9px;border-radius:8px;text-align:right;backdrop-filter:blur(3px)}
  .compass{fill:var(--ink-faint)}
  .pin{cursor:pointer}
  .pin:focus{outline:none}
  .pin-halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;transition:opacity .15s}
  .pin:hover .pin-halo{opacity:.4}
  .pin.sel .pin-halo{opacity:.7;stroke:var(--ink);stroke-width:3.5}
  .pin:focus-visible .pin-halo{opacity:.7;stroke:var(--accent)}
  .pin-dot{stroke:var(--surface);stroke-width:3;transition:transform .12s;transform-box:fill-box;transform-origin:center}
  .pin:hover .pin-dot{stroke-width:3.5}
  .pin-val{font-family:'Nunito',monospace;font-weight:600;font-size:14px;pointer-events:none;dominant-baseline:central}
  .pin-name{font-family:'Nunito',sans-serif;font-weight:600;font-size:12.5px;pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}

  /* popup da região sobre o mapa */
  .mpop{position:absolute;z-index:20;width:250px;max-width:82%;background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.22);transform:translate(-50%,calc(-100% - 20px));animation:pop .18s ease both}
  @keyframes pop{from{opacity:0;transform:translate(-50%,calc(-100% - 12px))}to{opacity:1;transform:translate(-50%,calc(-100% - 20px))}}
  .mpop::after{content:"";position:absolute;left:50%;bottom:-8px;width:15px;height:15px;background:var(--surface);border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
  .mpop-h{display:flex;align-items:center;gap:10px;padding:13px 14px 10px}
  .mpop-h .mp-sw{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:'Nunito',monospace;font-weight:600;font-size:16px}
  .mpop-h .mp-t{flex:1;min-width:0}
  .mpop-h .mp-t .n{display:block;font-weight:600;font-size:15px;line-height:1.15}
  .mpop-h .mp-t .s{display:block;font-size:11px;color:var(--ink-faint);font-family:'Nunito',monospace}
  .mpop-close{appearance:none;border:0;background:none;cursor:pointer;color:var(--ink-faint);padding:4px;border-radius:6px;line-height:0}
  .mpop-close:hover{color:var(--ink);background:var(--surface-2)}
  .mpop-axes{padding:2px 14px 8px;display:flex;flex-direction:column;gap:7px}
  .mpax{display:grid;grid-template-columns:74px 1fr 26px;gap:8px;align-items:center;font-size:11px}
  .mpax .k{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mpax .bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .mpax .bar i{display:block;height:100%;border-radius:3px}
  .mpax .vv{font-family:'Nunito',monospace;font-weight:600;text-align:right;color:var(--ink)}
  .mpax .vv.na{color:var(--ink-faint);font-weight:400}
  .mpax.on{background:var(--accent-soft);border-radius:6px;margin:0 -6px;padding:3px 6px}
  .mpax.on .k{color:var(--accent);font-weight:600}
  .mpop-comp{padding:2px 14px 10px;font-size:11.5px;color:var(--ink-faint);font-family:'Nunito',monospace}
  .mpop-comp b{color:var(--ink-soft)}
  .mpop-cta{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;padding:11px;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent);border-radius:0 0 13px 13px}
  .mpop-cta:hover{background:var(--accent-soft)}
  .map-hint{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:2px}

  .legend{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .legend .bar{height:10px;flex:1;min-width:160px;border-radius:5px;border:1px solid var(--line)}
  .legend .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);font-family:'Nunito',monospace;width:100%;margin-top:-4px}
  .legend .cap{font-size:12px;color:var(--ink-soft)}
  .hatch-key{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .hatch-swatch{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background-image:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 5px)}

  /* ranked list */
  .ranklist{padding:8px}
  .ranklist h3{font-size:13px;padding:8px 10px 4px;color:var(--ink-soft);font-weight:600}
  .rank{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;cursor:pointer;padding:9px 10px;border-radius:10px;color:var(--ink)}
  .rank:hover{background:var(--surface-2)}
  .rank.sel{background:var(--accent-soft)}
  .rank .swatch{width:12px;height:34px;border-radius:4px;flex:none}
  .rank .rk-name{flex:1;min-width:0}
  .rank .rk-name .n{display:block;font-weight:600;font-size:14px}
  .rank .rk-name .s{display:block;font-size:11.5px;color:var(--ink-faint)}
  .rank .rk-val{font-family:'Nunito',monospace;font-weight:600;font-size:19px;letter-spacing:-.02em}
  .rank .rk-val small{font-family:'Nunito',sans-serif;font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:0}
  .rank .chev{color:var(--ink-faint);flex:none}
  .rank.na .rk-val{font-family:'Nunito',sans-serif;color:var(--ink-faint);font-size:13px;letter-spacing:0}

  /* tooltip */
  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 11px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(4px);transition:opacity .12s;max-width:230px}
  .tip.on{opacity:1;transform:none}
  .tip .t-n{font-weight:600;margin-bottom:2px}
  .tip .t-v{font-family:'Nunito',monospace}
  .tip .t-s{color:color-mix(in srgb,var(--paper) 70%,var(--ink));font-size:11px;margin-top:3px}

  /* ============ REGIÃO ============ */
  .sel-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:18px}
  .picker{position:relative}
  .picker select{appearance:none;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:10px 40px 10px 14px;cursor:pointer;box-shadow:var(--shadow)}
  .picker select:hover{border-color:var(--accent)}
  .picker .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-faint)}
  .picker .pl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:5px;font-family:'Nunito',monospace}

  .region-top{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:stretch;margin-bottom:22px}
  .index-card{padding:22px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
  .index-card .ic-eye{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;font-family:'Nunito',monospace}
  .gauge{display:flex;align-items:baseline;gap:8px;margin:2px 0}
  .gauge .num{font-family:'Nunito',monospace;font-size:62px;font-weight:600;letter-spacing:-.04em;line-height:1}
  .gauge .den{font-family:'Nunito',monospace;font-size:18px;color:var(--ink-faint)}
  .gauge-track{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
  .gauge-fill{height:100%;border-radius:5px}
  .seal{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .seal .ring{--p:100;width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
  .seal .ring i{width:30px;height:30px;background:var(--surface);border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:'Nunito',monospace;font-style:normal;color:var(--ink)}
  .seal .st{font-size:12.5px;line-height:1.35}
  .seal .st b{display:block;font-size:13px}
  .seal .st span{color:var(--ink-faint)}

  .setores-card{padding:20px}
  .setores-card h3{font-size:13px;color:var(--ink-soft);margin-bottom:4px}
  .setores-card p{font-size:12.5px;color:var(--ink-faint);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-family:'Nunito',monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--ink-soft)}
  .chip-ref{background:transparent;border-style:dashed;color:var(--ink-soft);opacity:.9}
  .refs-lab{margin:11px 0 5px;font-size:12px;color:var(--ink-soft);font-weight:700}
  .setores-card .note{margin-top:14px;font-size:12px;color:var(--ink-faint);display:flex;gap:8px;align-items:flex-start}
  .setores-card .note svg{flex:none;width:14px;height:14px;margin-top:2px;color:var(--accent)}

  .axes-head{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px;flex-wrap:wrap;gap:8px}
  .axes-head h3{font-size:16px}
  .axes-head .wnote{font-size:12px;color:var(--ink-faint)}
  .axes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .axis{padding:18px;display:flex;flex-direction:column;gap:12px}
  .axis-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .axis-h .a-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .axis-h .a-name .ai{width:26px;height:26px;flex:none;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .axis-h .a-name .ai svg{width:15px;height:15px}
  .a-score{text-align:right;flex:none}
  .a-score .v{font-family:'Nunito',monospace;font-weight:600;font-size:24px;letter-spacing:-.02em;line-height:1}
  .a-score .w{font-size:10.5px;color:var(--ink-faint);font-family:'Nunito',monospace}
  .a-bar{height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .a-bar i{display:block;height:100%;border-radius:4px}
  .a-raw{font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
  .a-raw .rw{display:flex;gap:7px}
  .a-raw .rw .k{color:var(--ink-faint);flex:none}
  .a-raw .rw .val{font-family:'Nunito',monospace;color:var(--ink)}
  .a-meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11px;padding-top:10px;border-top:1px dashed var(--line-strong)}
  .a-meta div{display:flex;flex-direction:column;gap:1px}
  .a-meta .lab{color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;font-family:'Nunito',monospace;font-size:9.5px}
  .a-meta .dat{color:var(--ink-soft);font-family:'Nunito',monospace}
  .axis.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .axis.warn .ai{background:var(--warn-soft);color:var(--warn)}
  .warn-body{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--ink)}
  .warn-body svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:1px}
  .na-body{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-soft)}
  .na-body .hatch{width:30px;height:30px;flex:none;border-radius:7px;border:1px solid var(--line);background-image:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 6px)}

  /* ============ COMPARAÇÃO ============ */
  .cmp-pickers{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:end;margin-bottom:22px}
  .cmp-vs{font-family:'Nunito',monospace;font-weight:600;color:var(--ink-faint);padding-bottom:10px}
  .cmp-summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .cmp-sum{padding:18px;text-align:center}
  .cmp-sum .cs-n{font-weight:600;font-size:15px;margin-bottom:4px}
  .cmp-sum .cs-v{font-family:'Nunito',monospace;font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .cmp-sum .cs-s{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
  .cmp-rows{padding:8px 20px 20px}
  .cmp-rows h3{font-size:14px;padding:14px 0 6px}
  .cmp-row{padding:13px 0;border-top:1px solid var(--line)}
  .cmp-row .cr-lbl{font-size:13px;font-weight:500;margin-bottom:9px;display:flex;justify-content:space-between}
  .cmp-row .cr-lbl .cr-delta{font-family:'Nunito',monospace;font-size:12px;color:var(--ink-faint)}
  .cmp-bars{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:center}
  .cmp-bars .who{font-family:'Nunito',monospace;font-size:11px;color:var(--ink-faint)}
  .cmp-track{position:relative;height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .cmp-track i{position:absolute;left:0;top:0;height:100%;border-radius:5px 0 0 5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-family:'Nunito',monospace;font-size:11px;font-weight:600;color:#fff;min-width:26px}
  .cmp-track.na{display:flex;align-items:center;padding-left:9px;font-size:11px;color:var(--ink-faint)}

  /* ============ PERFIS (Para você) ============ */
  .pchips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px}
  .pchip{display:flex;align-items:center;gap:9px;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:8px 14px 8px 9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink-soft);box-shadow:var(--shadow)}
  .pchip:hover{border-color:var(--accent);color:var(--ink)}
  .pchip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pchip .pc-ic{width:26px;height:26px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
  .pchip.sel .pc-ic{background:rgba(255,255,255,.22);color:#fff}
  .pchip .pc-ic svg{width:16px;height:16px}
  .persona-desc{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-soft);margin:6px 0 18px;max-width:74ch}
  .persona-desc svg{flex:none;width:15px;height:15px;color:var(--accent);margin-top:2px}
  .persona-desc .pw{color:var(--ink-faint);font-family:'Nunito',monospace;font-size:11px}
  .persona-top{padding:20px;margin-bottom:16px}
  .pt-badge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;font-family:'Nunito',monospace;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .pt-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .pt-score{font-family:'Nunito',monospace;font-size:56px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .pt-name{font-size:22px;font-weight:600;letter-spacing:-.01em}
  .pt-reasons{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .pt-reasons b{color:var(--ink);font-weight:600}
  .pt-cta{margin-top:16px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--accent)}
  .pt-cta:hover{border-color:var(--accent);background:var(--accent-soft)}
  .pt-cta svg{width:15px;height:15px}
  .persona-rank{padding:8px 18px 16px}
  .persona-rank h3{font-size:14px;padding:12px 0 6px}
  .prow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:11px 6px;cursor:pointer;border-radius:8px;color:var(--ink);transition:transform .13s ease,background .13s ease}
  .prow:hover{background:var(--surface-2);transform:translateX(4px)}
  .rank,.pchip,.pt-cta,.mpop-cta{transition:transform .13s ease,background .13s ease,border-color .13s ease,color .13s ease}
  .rank:hover{transform:translateX(3px)}
  .pchip:hover{transform:translateY(-1px)}
  .prow .pr-rk{width:22px;flex:none;font-family:'Nunito',monospace;font-weight:600;color:var(--ink-faint);text-align:center}
  .prow.win .pr-rk{color:var(--accent)}
  .pr-bar-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .pr-name{font-weight:600;font-size:13.5px}
  .pr-bar{height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .pr-bar i{display:block;height:100%;border-radius:4px}
  .pr-reasons{font-size:11.5px;color:var(--ink-faint)}
  .pr-score{font-family:'Nunito',monospace;font-weight:600;font-size:19px;flex:none;width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .persona-warn{padding:20px;display:flex;gap:14px;align-items:flex-start;border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
  .persona-warn>svg{flex:none;width:22px;height:22px;color:var(--warn);margin-top:2px}
  .persona-warn h3{font-size:16px;margin-bottom:4px}
  .persona-warn p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:70ch}
  /* construtor de perfil */
  .persona-builder{padding:18px 20px;margin-bottom:16px}
  .persona-builder h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .persona-builder h3 svg{color:var(--accent)}
  .pb-hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 14px}
  .pb-grid{display:flex;flex-direction:column;gap:10px}
  .pb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pb-lbl{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--ink)}
  .pb-ic{width:28px;height:28px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .pb-ic svg{width:16px;height:16px}
  .pb-opts{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
  .pb-opt{appearance:none;border:0;background:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:6px 12px;border-radius:7px;transition:background .12s ease,color .12s ease}
  .pb-opt:hover{color:var(--ink)}
  .pb-opt.on{background:var(--accent);color:#fff}

  /* ============ METODOLOGIA ============ */
  .method{display:grid;grid-template-columns:210px 1fr;gap:34px;align-items:start}
  .toc{position:sticky;top:130px;font-size:13px;display:flex;flex-direction:column;gap:2px}
  .toc a{display:block;padding:6px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;border-left:2px solid transparent}
  .toc a:hover{background:var(--surface-2);color:var(--ink)}
  .prose{max-width:68ch}
  .prose section{padding:8px 0 26px;scroll-margin-top:150px}
  .prose h2{font-size:21px;letter-spacing:-.01em;margin-bottom:8px;display:flex;align-items:center;gap:11px}
  .prose h2 .sec-ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .prose h2 .sec-ic svg{width:19px;height:19px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .step{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:13px;align-items:flex-start}
  .step-n{font-family:'Anton','Nunito',sans-serif;font-size:30px;line-height:.9;color:var(--accent);flex:none;width:34px;text-align:center}
  .step-t{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:3px}
  .step-b p{font-size:12.5px;color:var(--ink-soft);margin:0}
  .step-b em{color:var(--accent);font-style:normal;font-weight:600}
  .m-note{display:flex;gap:9px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink)!important;margin:14px 0 0}
  .m-note svg{flex:none;width:16px;height:16px;color:var(--accent);margin-top:1px}
  .prose h3{font-size:14px;margin:16px 0 4px}
  .prose p{color:var(--ink-soft);margin:6px 0}
  .prose li{color:var(--ink-soft);margin:4px 0}
  .prose strong{color:var(--ink);font-weight:600}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .mini{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:15px}
  .mini h4{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .mini.yes h4{color:var(--accent)} .mini.no h4{color:var(--warn)}
  .mini p{font-size:12.5px;margin:2px 0}
  .formula{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 15px;font-family:'Nunito',monospace;font-size:12.5px;color:var(--ink);margin:10px 0;overflow-x:auto;white-space:nowrap}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:'Nunito',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;background:var(--surface-2)}
  tr:last-child td{border-bottom:0}
  td .mono{font-size:11.5px;color:var(--ink-soft)}
  .limit{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .limit:last-child{border-bottom:0}
  .limit .lm-ic{width:26px;height:26px;flex:none;border-radius:7px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center}
  .limit .lm-ic svg{width:15px;height:15px}
  .limit b{font-size:13.5px}
  .limit p{margin:2px 0 0;font-size:12.5px}

  .foot{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;font-size:12px;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

  /* ============ PESQUISA (percepção dos moradores) ============ */
  .pq-group{margin:26px 0 6px}
  .pq-group>h3{font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .pq-group>h3 .sec-ic{width:30px;height:30px;flex:none;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .pq-group>h3 .sec-ic svg{width:17px;height:17px}
  .pq-group>.gl{font-size:13px;color:var(--ink-faint);margin:0 0 12px}
  .pq-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pq-card{padding:16px 18px}
  .pq-h{font-size:14px;margin-bottom:13px;color:var(--ink);font-weight:700;line-height:1.3}
  .pq-row{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
  .pq-k{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pq-bar{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .pq-bar i{display:block;height:100%;border-radius:5px;min-width:3px}
  .pq-v{font-family:'Nunito',monospace;font-weight:700;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .pq-v small{font-weight:400;color:var(--ink-faint);margin-left:3px;font-size:10.5px}
  .pq-hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding:24px;margin:6px 0 2px;border-color:color-mix(in srgb,var(--warn) 36%,var(--line))}
  .pq-hero .ph-big{flex:none;text-align:center}
  .pq-hero .ph-big .n{font-family:'Anton','Nunito',sans-serif;font-size:66px;line-height:.86;color:var(--warn);display:block}
  .pq-hero .ph-big .l{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.02em}
  .pq-hero .ph-body{flex:1;min-width:230px}
  .pq-hero .ph-body h3{font-size:17px;margin-bottom:5px}
  .pq-hero .ph-body p{font-size:13px;color:var(--ink-soft);margin:0 0 12px;max-width:52ch}
  .pq-hero .ph-bars{display:flex;flex-direction:column;gap:7px}
  .pq-quotes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 4px}
  .pq-quote{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;padding:13px 15px;font-size:13px;color:var(--ink);line-height:1.5}
  .pq-quote span{display:block;margin-top:7px;font-size:11px;color:var(--ink-faint);font-family:'Nunito',monospace}
  .pq-themes{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
  .pq-theme{font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
  .pq-theme b{color:var(--accent)}
  .pq-samp{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .pq-samp .chip{font-family:'Nunito',monospace;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--ink-soft)}
  @media (max-width:760px){.pq-wrap,.pq-quotes{grid-template-columns:1fr}}

  /* ============ CAPA · HERO com FOTO ============ */
  .cover-hero{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;
    min-height:min(84vh,760px);margin:6px 0 0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 44%;z-index:-2}
  .hero-scrim{position:absolute;inset:0;z-index:-1;background:
    linear-gradient(180deg, rgba(8,22,48,.30) 0%, rgba(8,22,48,.10) 26%, rgba(8,22,48,.46) 72%, rgba(8,22,48,.72) 100%),
    radial-gradient(120% 90% at 50% 58%, transparent 40%, rgba(8,22,48,.34) 100%)}
  .hero-content{max-width:680px;width:100%;padding:56px 22px;text-align:center;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:15px}
  .hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;font-family:'Nunito',monospace;color:#fff;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.34);padding:6px 13px;border-radius:999px;backdrop-filter:blur(6px);animation:covrise .6s .05s both}
  .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:covpulse 2s ease-in-out infinite}
  .hero-logo{width:min(340px,66vw);height:auto;filter:drop-shadow(0 4px 18px rgba(0,0,0,.4));animation:covrise .6s .12s both}
  .hero-tag{font-family:'Baloo 2','Nunito',sans-serif;font-weight:700;letter-spacing:-.02em;
    font-size:clamp(22px,3.4vw,36px);line-height:1.12;margin:0;text-wrap:balance;
    text-shadow:0 2px 16px rgba(0,0,0,.4);animation:covrise .6s .2s both}
  .hero-tag strong{color:#BFE0FF}
  .hero-sub{font-size:clamp(14px,1.7vw,16.5px);line-height:1.55;margin:0;max-width:46ch;color:rgba(255,255,255,.94);
    text-shadow:0 1px 10px rgba(0,0,0,.45);animation:covrise .6s .28s both}

  .hero-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;animation:covrise .6s .34s both}
  .hero-chip{font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);

  .hero-enter{display:inline-flex;align-items:center;gap:9px;border:0;background:var(--accent);color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;padding:14px 26px;border-radius:14px;cursor:pointer;margin-top:4px;

  .cov-logo{display:none;height:clamp(52px,7vw,80px);width:auto;max-width:100%;margin-bottom:14px;animation:covrise .6s .12s both}

  .cov-enter:hover svg{transform:translateX(3px)}

  .cov-right{position:relative;display:flex;justify-content:center}
  .cov-map{width:100%;height:auto;max-height:72vh;filter:drop-shadow(0 22px 42px rgba(0,0,0,.14))}
  .cov-shape{fill:var(--map-soro-fill);stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;animation:covfade 1s ease both}
  .cov-pin{animation:pindrop .55s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center}
  @keyframes covrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes covpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
  @keyframes covfade{from{opacity:0}to{opacity:1}}
  @keyframes pindrop{0%{opacity:0;transform:translateY(-16px) scale(.55)}70%{transform:translateY(2px) scale(1.06)}100%{opacity:1;transform:none}}
  .pin.drop{animation:pindrop .5s cubic-bezier(.2,.8,.3,1) both;transform-box:fill-box;transform-origin:center}
  @media (prefers-reduced-motion:reduce){

// Deriva as notas de cada ZONA a partir dos setores (média) — fonte única = o GeoJSON.
function aplicarDadosReais(){
  if(typeof SET==="undefined"||!SET.length||typeof REGIONS==="undefined") return;
  function fmtm(x){ return x==null?"—":(x>=1000?(x/1000).toFixed(1).replace(".",",")+" km":Math.round(x)+" m"); }
  function med(a){ a=a.filter(function(v){return v!=null;}).sort(function(x,y){return x-y;}); if(!a.length)return null; var m=Math.floor(a.length/2); return a.length%2?a[m]:(a[m-1]+a[m])/2; }
  var acc={}; SETZONAS.forEach(function(z){ acc[z]={n:0,serv:0,mob:0,cam:0,amb:0,sau:0,esc:0,com:0,dz:[],ms:[],me:[],mc:[],mo:[],mp:[]}; });
  SET.forEach(function(s){ var z=SETZONAS[s[1]],a=acc[z]; if(!a)return; a.n++;
    a.serv+=s[3];a.mob+=s[4];a.cam+=s[5];a.amb+=s[6];a.sau+=s[7];a.esc+=s[8];a.com+=s[9];
    a.dz.push(s[10]);a.ms.push(s[11]);a.me.push(s[12]);a.mc.push(s[13]);a.mo.push(s[14]);a.mp.push(s[15]); });
  SETZONAS.forEach(function(z){ var a=acc[z],R=Math.round; if(!a.n||!REGIONS[z])return;
    REGIONS[z].scores={servicos:R(a.serv/a.n),mobilidade:R(a.mob/a.n),caminhabilidade:R(a.cam/a.n),ambiente:R(a.amb/a.n)};
    REGIONS[z].raw={ saude:"posto/clínica a "+fmtm(med(a.ms))+" a pé", educacao:"escola a "+fmtm(med(a.me))+" a pé",
      comercio:fmtm(med(a.mc))+" a pé até mercado/farmácia", mobilidade:"ponto de ônibus a "+fmtm(med(a.mo))+" a pé",
      caminhabilidade:R(med(a.dz))+"% dos serviços a ≤ 800 m a pé", ambiente:"praça/parque a "+fmtm(med(a.mp))+" a pé" };
    if(typeof SUB!=="undefined") SUB[z]={saude:R(a.sau/a.n),educacao:R(a.esc/a.n),comercio:R(a.com/a.n)};
  });
}
// Descrição em PALAVRAS do acesso (evita precisão falsa de metros). nota 0..100.
function palavraAcesso(v){
  if(v==null) return "não alcança a pé";
  if(v>=85) return "muito perto";
  if(v>=65) return "perto";
  if(v>=45) return "dá pra ir a pé";
  if(v>=25) return "um pouco longe";
  return "longe";
}

// Normaliza texto p/ busca: minúsculas, sem acento, sem pontuação extra
function normalizar(s){
  return (s||"").toString().toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g," ").trim();
}

function pontuarPerfil(id,persona){
  var pesos=persona.pesos, disp=[], somaPeso=0;
  for(var c in pesos){ var v=criterio(id,c); if(v!=null){ disp.push([c,pesos[c],v]); somaPeso+=pesos[c]; } }
  if(!disp.length||somaPeso===0) return {score:null,top:[]};
  var score=0, contribs=[];
  disp.forEach(function(d){ var w=d[1]/somaPeso; score+=w*d[2]; contribs.push({crit:d[0],val:d[2],contrib:w*d[2]}); });
  contribs.sort(function(a,b){return b.contrib-a.contrib;});
  return {score:Math.round(score), top:contribs.slice(0,2)};
}
function rankPerfil(persona){
  return ORDER.map(function(id){ var p=pontuarPerfil(id,persona); return {id:id,score:p.score,top:p.top}; })
    .filter(function(x){return x.score!=null;})
    .sort(function(a,b){return b.score-a.score;});
}

function composite(r){

}

/* -------- rampa de cor: um único matiz (teal), contínua -------- */
function themeMode(){
  var a=document.documentElement.getAttribute("data-theme");
  if(a==="dark") return "dark";
  if(a==="light") return "light";
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light";
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function ramp(t){ // t 0..1 -> rgb string usando --ramp-lo/mid/hi do tema atual
  t=Math.max(0,Math.min(1,t));
  var lo=cssVar("--ramp-lo").split(",").map(Number);
  var mid=cssVar("--ramp-mid").split(",").map(Number);
  var hi=cssVar("--ramp-hi").split(",").map(Number);
  var c0,c1,f;
  if(t<=0.5){c0=lo;c1=mid;f=t/0.5;} else {c0=mid;c1=hi;f=(t-0.5)/0.5;}
  var r=Math.round(c0[0]+(c1[0]-c0[0])*f);
  var g=Math.round(c0[1]+(c1[1]-c0[1])*f);
  var b=Math.round(c0[2]+(c1[2]-c0[2])*f);
  return "rgb("+r+","+g+","+b+")";
}
function fillFor(val){ return val==null ? "url(#hatch)" : ramp(val/100); }
// Rampa divergente verde->amarelo->vermelho, só para o mapa por setor (mais intuitiva p/ acesso)
function choroRamp(t){
  t=Math.max(0,Math.min(1,t));
  var stops=[[0,[192,57,43]],[0.35,[230,126,34]],[0.55,[241,196,15]],[0.75,[125,179,66]],[1,[39,141,96]]];
  for(var i=1;i<stops.length;i++){ if(t<=stops[i][0]){
    var a=stops[i-1],b=stops[i],f=(t-a[0])/(b[0]-a[0]);
    return "rgb("+a[1].map(function(v,k){return Math.round(v+(b[1][k]-v)*f);}).join(",")+")";
  }}
  return "rgb(39,141,96)";
}
function choroFill(val){ return val==null ? "url(#hatch)" : choroRamp(val/100); }
function textOn(val){
  if(val==null) return cssVar("--ink-soft");
  var lo=cssVar("--ramp-lo").split(",").map(Number),mid=cssVar("--ramp-mid").split(",").map(Number),hi=cssVar("--ramp-hi").split(",").map(Number);
  var t=val/100,c0,c1,f; if(t<=0.5){c0=lo;c1=mid;f=t/0.5;}else{c0=mid;c1=hi;f=(t-0.5)/0.5;}
  var r=c0[0]+(c1[0]-c0[0])*f,g=c0[1]+(c1[1]-c0[1])*f,b=c0[2]+(c1[2]-c0[2])*f;
  var L=(0.299*r+0.587*g+0.114*b)/255;
  return L>0.58 ? "#0d201d" : "#f2faf8";
}

      out.hidden=false;
      out.innerHTML='<div class="bsearch-empty">Nenhum bairro encontrado para <b>'+q.replace(/</g,"&lt;")+'</b>. Tente outro nome ou parte dele.</div>';
      return;
    }
    out.hidden=false;
    out.innerHTML=matches.map(function(it,i){
      var comp=composite(REGIONS[it.zona]);
      var scoreHTML = comp==null
        ? '<span class="bi-score na">s/d</span>'
        : '<span class="bi-score" style="background:'+fillFor(comp)+';color:'+textOn(comp)+'">'+comp+'<small>/100</small></span>';
      return '<button type="button" class="bsearch-item" data-zone="'+it.zona+'" data-i="'+i+'" role="option">'+
        svgIcon("pin",'width="15" height="15"')+
        '<span class="bi-name">'+hl(it.nome,q)+(it.ref?' <span class="bi-ref">referência</span>':'')+'</span>'+
        '<span class="bi-zone">'+it.zonaNome+'</span>'+
        scoreHTML+
        svgIcon("chev",'width="14" height="14"')+'</button>';
    }).join("");
    Array.prototype.forEach.call(out.querySelectorAll(".bsearch-item"),function(b){
      b.addEventListener("click",function(){ openRegion(b.dataset.zone); });
    });
  }
  function setActive(d){
    var items=out.querySelectorAll(".bsearch-item"); if(!items.length) return;
    active=(active+d+items.length)%items.length;
    Array.prototype.forEach.call(items,function(el,i){ el.classList.toggle("on",i===active); });
    items[active].scrollIntoView({block:"nearest"});
  }
  if(inp){
    inp.addEventListener("input",function(){ clr.hidden=!inp.value; paintResults(inp.value); });
    inp.addEventListener("keydown",function(e){
      if(e.key==="ArrowDown"){ e.preventDefault(); setActive(1); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); setActive(-1); }
      else if(e.key==="Enter"){
        var items=out.querySelectorAll(".bsearch-item");
        var pick=active>=0?items[active]:items[0];
        if(pick){ e.preventDefault(); openRegion(pick.dataset.zone); }
      } else if(e.key==="Escape"){ inp.value=""; clr.hidden=true; paintResults(""); }
    });
    clr.addEventListener("click",function(){ inp.value=""; clr.hidden=true; paintResults(""); inp.focus(); });
  }

  hideTip();
  animatePins=false;
}

/* =================== TELA 3 · COMPARAÇÃO =================== */
function renderComparacao(){
  var A=REGIONS[state.cmpA], B=REGIONS[state.cmpB];
  var cA=composite(A), cB=composite(B);

  function sumCard(r,c){
    var rel=reliability(r);
    return '<div class="card cmp-sum"><div class="cs-n">'+r.name+'</div>'+
      '<div class="cs-v">'+c+'</div>'+
      '<div class="cs-s">índice composto · '+rel.have+'/'+rel.exp+' eixos</div></div>';
  }

  var rowsHTML=MEASURABLE.map(function(k){
    var ax=null; for(var i=0;i<AXES.length;i++)if(AXES[i].key===k)ax=AXES[i];
    var va=A.scores[k], vb=B.scores[k];
    function bar(who,v){
      if(v==null) return '<span class="who">'+who+'</span><div class="cmp-track na">sem dado nesta zona</div>';
      return '<span class="who">'+who+'</span><div class="cmp-track"><i style="width:'+Math.max(v,3)+'%;background:'+ramp(v/100)+'">'+v+'</i></div>';
    }
    var delta = (va!=null&&vb!=null) ? (va-vb) : null;
    var deltaTxt = delta==null ? "—" : (delta>0?"+":"")+delta+" p/ "+(delta>0?A.name:delta<0?B.name:"empate");
    return '<div class="cmp-row"><div class="cr-lbl">'+ax.label+'<span class="cr-delta">Δ '+deltaTxt+'</span></div>'+
      '<div class="cmp-bars">'+bar("A",va)+bar("B",vb)+'</div></div>';
  }).join("");

  var html=noticeHTML()+'<div class="screen">'+
    '<span class="eyebrow">Comparação</span>'+
    '<h2 style="font-size:22px;letter-spacing:-.02em;margin:2px 0 4px">Duas zonas, lado a lado</h2>'+
    '<p class="lead" style="margin-bottom:18px">Duas zonas, eixo a eixo. Sem vencedor — só a leitura do acesso.</p>'+
    '<div class="cmp-pickers">'+
      pickerHTML("cmpA","Zona A",state.cmpA,'id="cmpASelect"')+
      '<span class="cmp-vs">vs</span>'+
      pickerHTML("cmpB","Zona B",state.cmpB,'id="cmpBSelect"')+
    '</div>'+
    '<div class="cmp-summary">'+sumCard(A,cA)+sumCard(B,cB)+'</div>'+
    '<div class="card cmp-rows"><h3>Por eixo</h3><p class="lead" style="font-size:12.5px;margin:0 0 4px">A = '+A.name+' · B = '+B.name+'</p>'+rowsHTML+'</div>'+
  '</div>';

  document.getElementById("app").innerHTML=html;
  document.getElementById("cmpASelect").addEventListener("change",function(e){ state.cmpA=e.target.value; renderComparacao(); });
  document.getElementById("cmpBSelect").addEventListener("change",function(e){ state.cmpB=e.target.value; renderComparacao(); });
}

/* =================== TELA 4 · PARA VOCÊ (perfis) =================== */
function renderPerfis(){
  var persona=null; for(var i=0;i<PERSONAS.length;i++) if(PERSONAS[i].key===state.persona) persona=PERSONAS[i];
  if(!persona) persona=PERSONAS[0];

  var chips=PERSONAS.map(function(p){
    var sel=p.key===state.persona?" sel":"";
    return '<button class="pchip'+sel+'" data-persona="'+p.key+'"><span class="pc-ic">'+svgIcon(p.icon)+
      '</span><span class="pc-n">'+p.nome+'</span></button>';
  }).join("");

  var pesosTxt="";
  if(persona.pesos){
    var parts=[]; for(var c in persona.pesos) parts.push(CRIT_LABEL[c]+" "+Math.round(persona.pesos[c]*100)+"%");
    pesosTxt=parts.join(" · ");
  }

  // construtor do perfil personalizado
  var builder="";
  var scoring=persona;
  if(persona.custom){
    var niveis=[["0","Nada"],["1","Importa"],["2","Muito"]];
    var rows=CRIT_ORDER.map(function(c){
      var lv=state.customW[c]||0;
      var opts=niveis.map(function(o){
        return '<button class="pb-opt'+(String(lv)===o[0]?" on":"")+'" data-crit="'+c+'" data-lv="'+o[0]+'">'+o[1]+'</button>';
      }).join("");
      return '<div class="pb-row"><span class="pb-lbl"><span class="pb-ic">'+svgIcon(CRIT_ICON[c])+'</span>'+CRIT_LABEL[c]+'</span>'+
        '<span class="pb-opts">'+opts+'</span></div>';
    }).join("");
    builder='<div class="card persona-builder"><h3>'+svgIcon("sliders",'width="18" height="18"')+' O que importa pra você?</h3>'+
      '<p class="pb-hint">Toque para dizer o quanto cada coisa pesa na sua escolha. A recomendação atualiza na hora.</p>'+
      '<div class="pb-grid">'+rows+'</div></div>';
    var pesos={}; CRIT_ORDER.forEach(function(c){ if((state.customW[c]||0)>0) pesos[c]=state.customW[c]; });
    scoring={pesos:pesos, custom:true};
  }

  var body;
  if(persona.indisponivel){
    body='<div class="card persona-warn" style="border-color:var(--line-strong)">'+svgIcon("access",'width="22" height="22"')+
      '<div><h3>Não dá para ranquear zonas por acessibilidade — mas os moradores falaram.</h3>'+
      '<p>Não existe base objetiva de rampas, piso tátil e semáforo sonoro por zona em Sorocaba, então não inventamos um ranking. O que temos é a <strong>percepção de quem vive a cidade</strong>: na nossa pesquisa de campo, <strong>63% dos 57 moradores</strong> acham o bairro pouco acessível.</p>'+
      '<button class="pt-cta pcd-ir" style="margin-top:14px">Ver a pesquisa '+svgIcon("chev",'width="15" height="15"')+'</button></div></div>';
  } else if(persona.custom && Object.keys(scoring.pesos).length===0){
    body=builder+'<div class="card persona-warn" style="border-color:var(--line-strong)">'+svgIcon("info",'width="22" height="22"')+
      '<div><h3>Escolha pelo menos uma coisa</h3><p>Marque acima o que importa pra você para ver qual zona combina mais.</p></div></div>';
  } else {
    var badgeName=persona.custom?"o seu perfil":persona.nome.toLowerCase();
    var rank=rankPerfil(scoring); var top=rank[0]; var tr=REGIONS[top.id];
    var reasons=top.top.map(function(t){return CRIT_LABEL[t.crit];});
    var winner='<div class="card persona-top">'+
      '<span class="pt-badge">Melhor para '+badgeName+'</span>'+
      '<div class="pt-main"><span class="pt-score" data-count="'+top.score+'">'+top.score+'</span>'+
        '<div class="pt-info"><div class="pt-name">'+tr.name+'</div>'+
        '<div class="pt-reasons">Se destaca em <b>'+reasons.join('</b> e <b>')+'</b> — o que mais pesa nessa escolha.</div>'+
        '<button class="pt-cta" data-region="'+top.id+'">Ver a zona '+svgIcon("chev")+'</button></div></div></div>';
    var list=rank.map(function(x,i){
      var r=REGIONS[x.id];
      var rs=x.top.map(function(t){return CRIT_LABEL[t.crit];}).join(", ");
      return '<button class="prow'+(i===0?' win':'')+'" data-region="'+x.id+'">'+
        '<span class="pr-rk">'+(i+1)+'</span>'+
        '<span class="pr-bar-wrap"><span class="pr-name">'+r.name+'</span>'+
        '<span class="pr-bar"><i style="width:'+x.score+'%;background:'+ramp(x.score/100)+'"></i></span>'+
        '<span class="pr-reasons">força em: '+rs+'</span></span>'+
        '<span class="pr-score">'+x.score+'</span></button>';
    }).join("");
    body=builder+winner+'<div class="card persona-rank"><h3>Ranking das zonas para este perfil</h3>'+list+'</div>';
  }

  var html=noticeHTML()+'<div class="screen">'+
    '<span class="eyebrow">Para você</span>'+
    '<h2 style="font-size:26px;margin:2px 0 4px">Qual zona combina com você?</h2>'+
    '<p class="lead" style="margin-bottom:6px">Escolha um perfil (ou <strong>crie o seu</strong>) e veja quais zonas oferecem melhor o que você precisa. Não é conselho de onde morar — é leitura de acesso.</p>'+
    '<div class="pchips" role="group" aria-label="Perfis">'+chips+'</div>'+
    '<p class="persona-desc">'+svgIcon("info",'width="15" height="15"')+'<span>'+persona.desc+
      (pesosTxt?' &nbsp; <span class="pw">pesos: '+pesosTxt+'</span>':'')+'</span></p>'+
    body+
  '</div>';

  document.getElementById("app").innerHTML=html;
  animateCounts(document.getElementById("app"));
  Array.prototype.forEach.call(document.querySelectorAll(".pchip"),function(b){
    b.addEventListener("click",function(){ state.persona=b.dataset.persona; renderPerfis(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".pb-opt"),function(b){
    b.addEventListener("click",function(){ state.customW[b.dataset.crit]=parseInt(b.dataset.lv,10); renderPerfis(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-region]"),function(b){
    b.addEventListener("click",function(){ state.region=b.dataset.region; state.tab="regiao"; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".pcd-ir"),function(b){
    b.addEventListener("click",function(){ state.tab="pesquisa"; render(); window.scrollTo({top:0,behavior:"smooth"}); });
  });
}

/* =================== TELA · PESQUISA (percepção dos moradores) =================== */
function renderPesquisa(){
  // Cores no mesmo idioma do mapa: verde = melhor, vermelho = pior; azul = neutro (perfil).
  var G='#2FA866', G2='#86C06B', A='#E0A33E', O='#E0733E', R='#D1495B', NEU='var(--accent)';
  // Cada linha: [rótulo, contagem, % (como no formulário), cor]
  function card(t, rows){
    var bars=rows.map(function(r){
      return '<div class="pq-row"><span class="pq-k" title="'+r[0]+'">'+r[0]+'</span>'+
        '<span class="pq-bar"><i style="width:'+r[2]+'%;background:'+r[3]+'"></i></span>'+
        '<span class="pq-v">'+r[1]+'<small>'+r[2]+'%</small></span></div>';
    }).join('');
    return '<div class="card pq-card"><div class="pq-h">'+t+'</div>'+bars+'</div>';
  }
  function grupo(ic, titulo, lead, cards){
    return '<div class="pq-group"><h3><span class="sec-ic">'+svgIcon(ic)+'</span>'+titulo+'</h3>'+
      (lead?'<p class="gl">'+lead+'</p>':'')+'<div class="pq-wrap">'+cards.join('')+'</div></div>';
  }

  var destaque='<div class="card pq-hero">'+
    '<div class="ph-big"><span class="n">63%</span><span class="l">dizem "Ruim"</span></div>'+
    '<div class="ph-body">'+
      '<h3>Acessibilidade para quem tem deficiência ou dificuldade de locomoção</h3>'+
      '<p>Foi o tema central da pesquisa. Dos 57 moradores, <strong>só 3 (5%)</strong> acham o bairro acessível; <strong>36 (63%)</strong> consideram <strong>Ruim</strong>. Nas respostas abertas aparecem calçadas com buracos e falta de rampas para cadeirantes.</p>'+
      '<div class="ph-bars">'+
        '<div class="pq-row"><span class="pq-k">Sim, é acessível</span><span class="pq-bar"><i style="width:5%;background:'+G+'"></i></span><span class="pq-v">3<small>5%</small></span></div>'+
        '<div class="pq-row"><span class="pq-k">Regular</span><span class="pq-bar"><i style="width:32%;background:'+A+'"></i></span><span class="pq-v">18<small>32%</small></span></div>'+
        '<div class="pq-row"><span class="pq-k">Ruim</span><span class="pq-bar"><i style="width:63%;background:'+R+'"></i></span><span class="pq-v">36<small>63%</small></span></div>'+
      '</div>'+

function renderMetodologia(){
  var html=noticeHTML()+'<div class="screen"><span class="eyebrow">Metodologia</span>'+
  '<h2 style="font-size:27px;margin:2px 0 6px">Como cada nota nasce</h2>'+
  '<p class="lead" style="margin-bottom:22px"><strong>Todo número pode ser conferido</strong>: um dado público, uma conta clara e uma data. Nada é chutado.</p>'+
  '<div class="method">'+
    '<nav class="toc" aria-label="Seções">'+
      '<a href="#m-oque">O que é / não é</a>'+
      '<a href="#m-calculo">Como calculamos</a>'+
      '<a href="#m-eixos">O que a gente mede</a>'+
      '<a href="#m-fontes">De onde vêm os dados</a>'+
      '<a href="#m-limites">O que ainda falta</a>'+
    '</nav>'+
    '<div class="prose">'+

    '<section id="m-oque"><h2><span class="sec-ic">'+svgIcon("info")+'</span>O que é — e o que não é</h2>'+
      '<div class="two-col">'+
        '<div class="mini yes"><h4>✓ É</h4>'+
          '<p>Um retrato transparente do acesso a serviços e infraestrutura.</p>'+
          '<p>Uma nota que dá para conferir num dado público de verdade.</p>'+
          '<p>Uma ferramenta para conversar sobre a cidade.</p></div>'+
        '<div class="mini no"><h4>✕ Não é</h4>'+
          '<p>Um ranking de "bairro bom ou ruim".</p>'+
          '<p>Uma medida de preço de imóvel ou de segurança.</p>'+
          '<p>Um dado oficial da Prefeitura.</p></div>'+
      '</div></section>'+

    '<section id="m-calculo"><h2><span class="sec-ic">'+svgIcon("sliders")+'</span>Como calculamos, em 4 passos</h2>'+
      '<div class="steps">'+
        '<div class="step"><span class="step-n">1</span><div class="step-b"><div class="step-t">Nota de 0 a 100</div>'+
          '<p>Distância <strong>a pé</strong> de cada setor até o item mais perto: perto vale 100, longe vale 0 (ônibus: 200 m = 100, 800 m = 0). A nota da zona é a <strong>média dos setores</strong> — quase uma média por morador.</p></div></div>'+
        '<div class="step"><span class="step-n">2</span><div class="step-b"><div class="step-t">Juntamos os eixos</div>'+
          '<p>A nota da zona é a <strong>média</strong> dos eixos que têm dado. Cada eixo pesa igual.</p></div></div>'+
        '<div class="step"><span class="step-n">3</span><div class="step-b"><div class="step-t">Faltou dado? Divide</div>'+
          '<p>Se um eixo não tem dado numa zona, o peso dele vai para os outros — <strong>nunca vira zero</strong>. Zerar puniria a zona por uma falha de dado.</p></div></div>'+
        '<div class="step"><span class="step-n">4</span><div class="step-b"><div class="step-t">Selo de confiança</div>'+
          '<p>Cada zona mostra quantos eixos deu para calcular (ex.: <strong>3 de 4</strong>). Nota alta com selo baixo pede cautela.</p></div></div>'+
      '</div>'+
      '<p class="m-note">'+svgIcon("info")+'<span>No mapa por setor, <strong>verde</strong> = mais perto dos serviços e <strong>vermelho</strong> = mais longe. É um retrato de <strong>acesso</strong>, não uma nota de "aprovado/reprovado".</span></p>'+
    '</section>'+

    '<section id="m-eixos"><h2><span class="sec-ic">'+svgIcon("layers")+'</span>O que a gente mede</h2>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Eixo</th><th>O que olhamos</th><th>Direção</th></tr></thead><tbody>'+
      '<tr><td>Serviços essenciais</td><td>Distância a pé até saúde (500 m → 2 km), escola (500 m → 1,5 km) e mercado/farmácia/padaria (250 m → 1 km)</td><td>mais perto é melhor</td></tr>'+
      '<tr><td>Mobilidade</td><td>Distância a pé até o ponto de ônibus mais próximo (200 m → 800 m)</td><td>mais perto é melhor</td></tr>'+
      '<tr><td>Acesso urbano</td><td>Cruzamentos de rua por km² num raio de 500 m + quantos dos 5 itens ficam a até 800 m a pé (cidade de 10 minutos)</td><td>mais é melhor</td></tr>'+
      '<tr><td>Meio ambiente</td><td>Distância a pé até praça ou parque (250 m → 1 km); reservas naturais não contam</td><td>mais perto é melhor</td></tr>'+
      '<tr><td>Acessibilidade · PCD</td><td>Rampas, piso tátil, semáforo sonoro — <em>sem dado objetivo</em>. Por enquanto só a <em>percepção</em> dos moradores (aba Pesquisa, 57 respostas): 63% acham o bairro pouco acessível</td><td>—</td></tr>'+
      '</tbody></table></div></section>'+

    '<section id="m-fontes"><h2><span class="sec-ic">'+svgIcon("doc")+'</span>De onde vêm os dados</h2>'+
      '<p>Só usamos fontes públicas e confiáveis. Quando uma fonte não existe (ex.: horários de ônibus da URBES), o indicador fica <strong>indisponível</strong> — a gente não inventa.</p>'+
      '<div class="tbl-wrap"><table><thead><tr><th>Dado</th><th>Fonte</th></tr></thead><tbody>'+
      '<tr><td>Mapa das zonas e população</td><td>IBGE · Censo 2022</td></tr>'+
      '<tr><td>Unidades de saúde</td><td>CNES · DataSUS (abr/2026)</td></tr>'+
      '<tr><td>Escolas</td><td>INEP · Censo Escolar 2025</td></tr>'+
      '<tr><td>Ônibus, ruas, mercados, parques</td><td>OpenStreetMap</td></tr>'+
      '<tr><td>Percepção dos moradores (aba Pesquisa)</td><td>Pesquisa de campo do grupo · SENAC · 57 respostas</td></tr>'+
      '</tbody></table></div></section>'+

    '<section id="m-limites"><h2><span class="sec-ic">'+svgIcon("warn")+'</span>O que ainda falta (dito na cara)</h2>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>Acessibilidade sem base objetiva</b><p>Não há dado confiável de rampas, piso tátil ou semáforo sonoro, então o eixo aparece sem nota. O que temos é a <strong>percepção</strong> dos moradores na aba <strong>Pesquisa</strong> (pesquisa de campo do grupo, 57 respostas): é um retrato do que as pessoas sentem, não uma auditoria das calçadas — e por ser amostra de conveniência não entra no índice.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>OpenStreetMap é feito por voluntários</b><p>A cobertura de ônibus, comércio e parques muda de zona para zona; precisa ser checada por amostragem.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>Ônibus: só a distância, não o horário</b><p>Medimos se há ponto por perto, não a frequência real das linhas — é uma aproximação.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>As zonas reúnem bairros</b><p>Cada zona (Centro, Norte, Sul, Leste, Oeste) agrupa vários bairros. A divisão e a lista de bairros são uma escolha documentada nos dados, não uma fronteira oficial da Prefeitura.</p></div></div>'+
      '<div class="limit"><span class="lm-ic">'+svgIcon("warn")+'</span><div><b>A pé pela rua, mas sem calçada e sem morro</b><p>A distância segue o traçado das ruas a partir do centro de cada setor, mas o OpenStreetMap não diz se a calçada é boa, se há iluminação ou quanto a rua sobe. Saúde vem do CNES e escolas do INEP (oficiais); ônibus, comércio e praças, do OSM. Setores sem caminho a pé até um serviço (50 dos 1.148, a maioria na Zona Industrial) ficam com nota 0 nesse eixo.</p></div></div>'+
    '</section>'+

    '<div class="foot"><span>CityLens · Sorocaba · IBGE + CNES + INEP + OpenStreetMap</span><span class="mono">v1 · dados reais · set/2026</span></div>'+

  document.getElementById("app").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".toc a"),function(a){
    a.addEventListener("click",function(e){
      e.preventDefault();
      var t=document.querySelector(a.getAttribute("href"));
      if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
    });
  });
}

  var html='<div class="cover-hero">'+
    '<img class="hero-img" src="'+HERO_IMG+'" alt="Paço Municipal de Sorocaba sob o céu azul">'+
    '<div class="hero-scrim"></div>'+
    '<div class="hero-content">'+
      '<span class="hero-badge"><span class="dot"></span>Projeto escolar · protótipo</span>'+
      '<img class="hero-logo" src="'+LOGO_WM_DARK+'" alt="CityLens">'+
      '<p class="hero-tag">O acesso urbano de <strong>Sorocaba</strong>, zona por zona</p>'+
      '<p class="hero-sub"><strong>Acesso a serviços e infraestrutura</strong>, zona por zona — cada nota vem de um dado público.</p>'+
      '<div class="hero-chips">'+chips+'</div>'+
      '<button class="hero-enter" id="covEnter">Explorar o mapa '+svgIcon("chev",'width="18" height="18"')+'</button>'+

    '</div>'+
    '<span class="hero-credit">Paço Municipal de Sorocaba</span>'+
  '</div>';
  document.getElementById("app").innerHTML=html;
  document.getElementById("covEnter").addEventListener("click",function(){
    state.cover=false; state.tab="mapa"; animatePins=true; render(); window.scrollTo({top:0});
  });
}

/* =================== ROUTER =================== */
function render(){
  var tabsNav=document.querySelector(".tabs");
  hideTip();
  if(state.cover){
    if(tabsNav) tabsNav.hidden=true;
    renderCover();
    return;
  }
  if(tabsNav) tabsNav.hidden=false;
  renderTabs();
  if(state.tab==="mapa") renderMapa();
  else if(state.tab==="regiao") renderRegiao();
  else if(state.tab==="comparacao") renderComparacao();
  else if(state.tab==="perfis") renderPerfis();
  else if(state.tab==="pesquisa") renderPesquisa();
  else renderMetodologia();
}

/* tema */
document.getElementById("themeBtn").addEventListener("click",function(){
  var cur=themeMode();
  document.documentElement.setAttribute("data-theme", cur==="dark"?"light":"dark");
  render();
});
// clicar na logo/marca volta para a capa (início)
(function(){
  var home=document.getElementById("homeBtn");
  function voltarInicio(){ if(state.cover) return; state.cover=true; state.popup=null; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  if(home){
    home.addEventListener("click",voltarInicio);
    home.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); voltarInicio(); } });
  }
})();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){
  if(!document.documentElement.getAttribute("data-theme")) render();
});

render();
</script>
